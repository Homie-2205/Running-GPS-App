<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f6;
            color: #333;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .contact-section {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            margin: 0 auto;
        }

        .contact-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .contact-form {
            flex: 0 1 600px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 0 auto;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .input-group {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .input-group input {
            width: 100%;
            padding: 25px 30px;
            font-size: 1.1rem;
            border: 2px solid #33cc33;
            border-radius: 25px;
            background-color: #e6ffcc;
            color: #333333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #33cc33;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            background-color: #e6ffcc;
        }

        .content-text h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 0.5rem;
            font-family: Georgia, Serif;
            letter-spacing: 5px;
            font-weight: 180;
            text-align: center;
        }

        .custom-button {
            display: inline-block;
            width: 100%;
            padding: 28px 24px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            color: #1a1100;
            background-color: #33cc33;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .custom-button:hover {
            background-color: #005ce6;
            color: #ffffff;
        }

        .custom-button:active {
            transform: scale(0.98);
        }

        .total-box {
            margin: 15px 0;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .audio-box {
            width: 100%;
            margin-top: 10px;
            text-align: center;
        }

        audio {
            width: 100%;
            max-width: 420px;
        }

        .site-footer {
            width: 100%;
            background-color: #33cc33;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            box-sizing: border-box;
            margin-top: 30px;
        }

        .site-footer p {
            margin: 0;
        }

        @media (min-width: 1300px) {
            .input-group input, .custom-button {
                width: 800px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <section class="contact-section">
            <div class="contact-container">
                <div class="form-group">
                    <div class="contact-form">
                        <div class="inputs-container">
                            <div class="content-text">
                                <h2>Manzana Golden</h2>
                            </div>

                            <form id="dataForm" action="https://script.google.com/macros/s/AKfycbzzsT61fbKuoUKTVQQJBVbtdMkupzRo6cJ8AOha_GG38qw1RYuib8owtBIRVc_V-RYn/exec" method="POST">
                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="text" id="username" name="username" placeholder="Pon tu nombre" required>
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="text" id="address" name="address" placeholder="Pon tu dirección" required>
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="text" id="neighborhood" name="neighborhood" placeholder="Pon tu barrio" required>
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="tel" id="cellphone" name="cellphone" placeholder="Pon tu telefono" required>
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="number" id="weight" name="weight" min="0.1" step="0.1" value="1.0" oninput="recalculatePrice()" required>
                                </div>

                                <div class="total-box">
                                    Total: $<span id="totalPrice">4.500</span> COP
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="text" id="text" name="text" placeholder="Escribe la fruta de nuevo" required>
                                </div>

                                <div class="input-group" style="margin-bottom: 15px;">
                                    <input type="text" id="price" name="price" placeholder="Escribe de nuevo el precio" required>
                                </div>

                                <div class="audio-box">
                                    <audio id="audioPlayer" preload="auto" controls playsinline>
                                        <source src="audio/iamm.mp3" type="audio/mpeg">
                                    </audio>
                                </div>

                                <button type="submit" class="custom-button" id="submitBtn" style="cursor: pointer; width: 140px; margin-top: 28px;">
                                    Enviar
                                </button>
                            </form>

                            <div id="message"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 MyBrand. Cristian Mauricio Arcos All rights reserved.</p>
    </footer>

    <script>
        const PRICE_PER_KILO = 4500;

        function recalculatePrice() {
            const pesoInput = document.getElementById('weight').value;
            const precioTotalSpan = document.getElementById('totalPrice');
            const currentWeight = parseFloat(pesoInput) || 0;
            const finalPrice = currentWeight * PRICE_PER_KILO;
            precioTotalSpan.textContent = finalPrice.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const audioPlayer = document.getElementById('audioPlayer');

        function playAudio() {
            const preferredSource = 'iamm.mp3';
            const fallbackSource = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';

            try {
                audioPlayer.src = preferredSource;
                audioPlayer.load();

                const playPromise = audioPlayer.play();
                if (playPromise && typeof playPromise.then === 'function') {
                    playPromise.catch(() => {
                        audioPlayer.src = fallbackSource;
                        audioPlayer.load();
                        audioPlayer.play().catch(() => {});
                    });
                }
            } catch (error) {
                console.warn('Audio could not be played:', error);
                audioPlayer.src = fallbackSource;
                audioPlayer.load();
                audioPlayer.play().catch(() => {});
            }
        }

        audioPlayer.addEventListener('error', () => {
            audioPlayer.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
            audioPlayer.load();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            playAudio();

            submitBtn.disabled = true;
            messageDiv.style.display = 'block';
            messageDiv.textContent = 'Enviando pedido...';
            messageDiv.style.color = 'black';

            const formData = new FormData(form);
            const urlEncodedData = new URLSearchParams();

            for (const pair of formData) {
                urlEncodedData.append(pair[0].trim(), pair[1]);
            }

            fetch(form.action, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: urlEncodedData.toString()
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    messageDiv.textContent = '¡Pedido registrado con éxito!';
                    messageDiv.style.color = 'green';
                    form.reset();
                    recalculatePrice();
                    setTimeout(() => {
                        messageDiv.style.display = 'none';
                    }, 3500);
                } else {
                    throw new Error(data.error || 'Unknown sheet writing issue.');
                }
            })
            .catch(error => {
                messageDiv.textContent = 'Error al enviar. Por favor intente de nuevo.';
                messageDiv.style.color = 'red';
                console.error('Submission Error Details:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
            });
        });

        recalculatePrice();
    </script>
</body>
</html>
