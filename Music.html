            color: black;

        .menu-item {
            margin: 15px 0;
            display: flex;
            align-items: center;
        }

        /* Estilo para los iconos */
        .menu-item i {
            color: yellow;
            font-size: 22px;
            width: 35px; /* Ancho fijo para mantener los textos alineados */
            text-shadow: -1px -1px 0 #000;
            -webkit-text-stroke: 1px black;
            transition: all 0.3s ease;
        }

        a {
            font-family: Georgia, serif;
            font-size: 22px;
            color: yellow;
            text-decoration: none;
            transition: all 0.3s ease; 
            -webkit-text-stroke: 1px black; 
            display: inline-block;
        }

        /* Efecto Hover unificado para Icono + Texto */
        .menu-item:hover a {
            font-family: "Courier New", Georgia, serif; 
            font-size: 24px;                     
            color: red;                          
        }

        .menu-item:hover i {
            color: red;
            font-size: 24px;
        }

        .card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            width: 100%;
            max-width: 400px; 
            margin: 10px auto; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border-bottom: 4px solid var(--accent); 
            box-sizing: border-box;
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .input-group label {
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        input { 
            background: rgba(255, 255, 255, 0.7); 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        .stats { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }

        .stat-item { 
            background: rgba(0, 0, 0, 0.6); 
            padding: 15px; 
            border-radius: 10px; 
            color: white;
        }

        .stat-value { 
            font-size: 1.8em; 
            font-weight: bold; 
            display: block; 
            color: #ffff66; 
        }

        .full-width {
            grid-column: span 2;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            transition: 0.3s; 
        }

        .start { background: #00cc44; color: white; }
        .stop { background: #cc0000; color: white; }

    <style>  /* Foreground main image or content card */
        .main-card {
            position: relative;
            z-index: 10; /* Keeps your foreground content safely above background bubbles */
            background: rgba(255, 255, 255, 0.75);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
                 display: flex;
            justify-content: center;
            align-items: center;
               background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
            background-repeat: no-repeat;
        }

        .main-card h1 {
            color: #4a1525;
            margin-bottom: 10px;
        }

        /* The Bubble Layer Container */
        .bubble-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Allows users to click elements underneath if needed */
        }

        /* Core Bubble Styling */
        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 70%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.5), 0 5px 15px rgba(0, 0, 0, 0.05);
            animation: floatUp 12s infinite linear;
        }

        /* Creating randomized look and staggered float times using bubbles */
        .bubble:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 14s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 25%; width: 45px; height: 45px; animation-duration: 10s; animation-delay: 2s; opacity: 0.7; }
        .bubble:nth-child(3) { left: 40%; width: 110px; height: 110px; animation-duration: 18s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 55%; width: 35px; height: 35px; animation-duration: 9s; animation-delay: 5s; }
        .bubble:nth-child(5) { left: 70%; width: 90px; height: 90px; animation-duration: 15s; animation-delay: 3s; }
        .bubble:nth-child(6) { left: 85%; width: 60px; height: 60px; animation-duration: 12s; animation-delay: 7s; opacity: 0.8; }

        /* Floating animation moving bubbles from bottom to top */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>

   <style>


    /* 2. Entire Screen Background Fruits Container */
    .screen-background-fruits {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Sits behind everything else */
      pointer-events: none; /* Keeps clicks from hitting the background fruits */
    }

    /* 3. Base Floating Fruit Styles */
    .fruit {
      position: absolute;
      bottom: -100px; /* Start below the visible screen */
      opacity: 0;
      user-select: none;
      animation: floatUpFullScreen 8s linear infinite;
    }

    /* 4. Staggered screen positions, sizes, and delays across the screen width */
    .apple-1      { left: 10%;  font-size: 3rem;   animation-delay: 0s;   animation-duration: 9s; }
    .banana-1     { left: 25%;  font-size: 3.5rem; animation-delay: 2s;   animation-duration: 7s; }
    .pineapple-1  { left: 40%;  font-size: 4rem;   animation-delay: 4s;   animation-duration: 10s; }
    .apple-2      { left: 60%;  font-size: 2.8rem; animation-delay: 1s;   animation-duration: 8s; }
    .banana-2     { left: 75%;  font-size: 3.8rem; animation-delay: 5s;   animation-duration: 11s; }
    .pineapple-2  { left: 90%;  font-size: 4.5rem; animation-delay: 3s;   animation-duration: 9s; }

    /* 5. Core Full-Screen Animation Logic */
    @keyframes floatUpFullScreen {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8; /* Keep it soft and ambient so it doesn't distract from the button */
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg); /* Float entirely past the top of the viewport */
        opacity: 0;
      }
    }

    /* 6. Clean, Eye-Catching Center Button */
    .center-button {
      position: relative;
      z-index: 2; /* Ensures the button sits clearly in front of the floating fruits */
      padding: 18px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(45px, #ff416c, #ff4b2b);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Button Interactivity */
    .center-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 75, 43, 0.6);
    }

    .center-button:active {
      transform: translateY(-1px) scale(1.01);
    }
  
  </style>
