<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Ubicación</title>

<style>

*{
    margin:0;

body{

    background:#0f172a;

    margin:12px 0;

    font-weight:bold;

}

.valor{

    color:#2563eb;

}

button{

    width:100%;
    padding:12px;

    background:#1d4ed8;

</head>

<body>

<div class="card">

<h2>Mi Ubicación</h2>

<div class="info">
<label>Latitud</label><br>
<span id="lat" class="valor">---</span>
</div>

<div class="info">
<label>Longitud</label><br>
<span id="lon" class="valor">---</span>
</div>

<div class="info">
<label>Precisión</label><br>
<span id="precision" class="valor">---</span>
</div>



  

<div class="info">
<label>Última actualización</label><br>
<span id="hora" class="valor">---</span>
</div>

<button onclick="obtenerUbicacion()">
Actualizar ubicación
</button>

</div>

 <form id="https://script.google.com/macros/s/AKfycbwjQuCzOEmaTeYyS5woD0RthX8t2mxPCg_W1htdNMvMBtYhoBPSFa1zidGvckFE63a0/exec">   
    <div class="form-group">
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name" required>
        </div>
        <div class="form-group">
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" required>
        </div>
        <!-- Added Phone Field Here -->
        <div class="form-group">
            <label for="Phone">Phone Number:</label>
            <input type="tel" id="Phone" name="Phone" required>
        </div>
        <button  class="custom-button" type="submit" id="submitBtn">Submit Data</button>
 
 

      </form>
       <div id="message"></div>
     






<script>

// Pega aquí la URL de tu Google Apps Script
const URL_SCRIPT="";

function obtenerUbicacion(){

if(!navigator.geolocation){

alert("Este dispositivo no soporta GPS");
return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;
let pre=pos.coords.accuracy;

document.getElementById("lat").innerHTML=lat;
document.getElementById("lon").innerHTML=lon;
document.getElementById("precision").innerHTML=pre+" metros";
document.getElementById("hora").innerHTML=new Date().toLocaleString();

// Enviar datos al Google Apps Script
if(URL_SCRIPT!=""){

fetch(URL_SCRIPT,{

method:"POST",

body:JSON.stringify({

latitud:lat,
longitud:lon,
precision:pre,
fecha:new Date().toLocaleString()

})

})

.then(r=>console.log("Ubicación enviada"))
.catch(e=>console.log(e));

}

},

function(error){

alert("No fue posible obtener la ubicación.");

},

{

enableHighAccuracy:true,
maximumAge:0,
timeout:15000

}

);

}

// Obtener ubicación al abrir
obtenerUbicacion();

// Cada 5 minutos
setInterval(obtenerUbicacion,300000);

</script>


      <script>
     const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    // Keeps you on the same page
    e.preventDefault(); 

    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    const formData = new FormData(form);
    const urlEncodedData = new URLSearchParams(formData);

       fetch(form.action, {
        method: 'POST',
        body: urlEncodedData, // Added missing comma here
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`Server responded with status ${response.status}`);
        }
        return response.text(); 
    })
    .then(text => {
        submitBtn.disabled = false;

        try {
            const data = JSON.parse(text);
            console.log("Success Data:", data);
        } catch (e) {
            console.log("Server responded with plain text instead of JSON:", text);
        }


        messageDiv.textContent = "Data submitted successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        submitBtn.disabled = false;
        messageDiv.textContent = "Error submitting data. Please check your script.";
        messageDiv.style.color = "red";
        console.error("Submission Error Details:", error); 
    });
});
    </script>



    








    

</body>
