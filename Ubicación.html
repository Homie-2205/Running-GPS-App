<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Ubicación</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.card{

    width:340px;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,.3);

}

h2{

    text-align:center;
    margin-bottom:20px;
    color:#1e3a8a;

}

.info{

    margin:12px 0;

}

label{

    font-weight:bold;

}

.valor{

    color:#2563eb;
    word-wrap:break-word;

}

button{

    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

</style>

</head>

<body>

<div class="card">

<h2>Mi Ubicación</h2>
<form id="dataform" action="https://script.google.com/macros/s/AKfycby9CdKi0P0NMzrjj55jgSqUQndrVNOqUu_6isbXaGkSa2yV0xCQk98C5jSCeBUzO6Dn/exec" method="POST">   
<div class="info">
<label>Latitud</label><br>
<span id="Nlat" class="valor">---</span>
</div>

<div class="info">
<label>Longitud</label><br>
<span id="Alon" class="valor">---</span>
</div>

<div class="info">
<label>Precisión</label><br>
<span id="precision" class="valor">---</span>
</div>



  

<div class="info">
<label>Última actualización</label><br>
<span id="hora" class="valor">---</span>
</div>

<button onclick="obtenerUbicacion()">
Actualizar ubicación
</button>

</div>

    <button  class="custom-button" type="submit" id="submitBtn">Submit Data</button>

      </form>
       <div id="message"></div>
         <script>
     const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    // Keeps you on the same page
    e.preventDefault(); 
    
    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    const formData = new FormData(form);
    const urlEncodedData = new URLSearchParams(formData);

       fetch(form.action, {
        method: 'POST',
        body: urlEncodedData, // Added missing comma here
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        }
    })

           .then(response => {
        if (!response.ok) {
            throw new Error(`Server responded with status ${response.status}`);
        }
        return response.text(); 
    })
    .then(text => {
        submitBtn.disabled = false;
        
        try {
            const data = JSON.parse(text);
            console.log("Success Data:", data);
        } catch (e) {
            console.log("Server responded with plain text instead of JSON:", text);
        }
              

        messageDiv.textContent = "Data submitted successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        submitBtn.disabled = false;
        messageDiv.textContent = "Error submitting data. Please check your script.";
        messageDiv.style.color = "red";
        console.error("Submission Error Details:", error); 
    });
});
             

         </script>



</body>
</html>
