<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor AVI a MP4 (Servidor)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .converter-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .drop-zone {
            border: 2px dashed #007bff;
            padding: 30px;
            border-radius: 8px;
            background: #f8faff;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .drop-zone:hover { background: #eef4ff; }
        .file-label { color: #007bff; font-weight: bold; cursor: pointer; }
        .file-name { margin-top: 10px; font-size: 13px; color: #444; font-weight: 500; }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        button:not(:disabled):hover { background-color: #0056b3; }
        .progress-container { margin-top: 20px; text-align: left; display: none; }
        .status { font-size: 14px; color: #555; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="converter-container">
        <h2>Convertidor AVI a MP4</h2>
        <p>Sube tu archivo AVI para procesarlo en el servidor.</p>
        
        <div class="drop-zone" id="dropZone">
            <label class="file-label" for="fileInput">Selecciona o arrastra tu archivo AVI</label>
            <input type="file" id="fileInput" accept=".avi" style="display: none;">
            <div class="file-name" id="fileName">Ningún archivo seleccionado</div>
        </div>

        <button id="convertBtn" disabled>Convertir en Servidor</button>

        <div class="progress-container" id="progressContainer">
            <div class="status" id="statusMessage">Subiendo y convirtiendo archivo... Por favor espera.</div>
        </div>
    </div>

    <script>
        // CHANGE THIS to your actual live Render URL!
        const SERVER_URL = 'http://localhost:3000/convert'; 

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const statusMessage = document.getElementById('statusMessage');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFileSelection(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#eef4ff'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.background = '#f8faff');
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '#f8faff';
            if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
        });

        function handleFileSelection(file) {
            if (file && file.name.endsWith('.avi')) {
                selectedFile = file;
                fileNameDisplay.textContent = file.name;
                convertBtn.disabled = false;
            } else {
                alert('Por favor selecciona un archivo .avi válido.');
            }
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            progressContainer.style.display = 'block';
            statusMessage.textContent = 'Subiendo video al servidor y procesando...';

            const formData = new FormData();
            formData.append('video', selectedFile);

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Error en la conversión del servidor.');

                // Capture the binary blob returned by the server
                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                
                // Programmatically trigger a direct browser file download
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = selectedFile.name.replace('.avi', '.mp4');
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusMessage.textContent = '¡Conversión y descarga completadas!';
            } catch (error) {
                console.error(error);
                statusMessage.textContent = 'Error: No se pudo completar la conversión.';
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
