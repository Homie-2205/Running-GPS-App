<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor AVI a MP4</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cargamos FFmpeg desde una red de distribución (CDN) -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div class="converter-container">
        <h2>Convertidor de AVI a MP4</h2>
        <p>Convierte tus videos localmente de forma segura en tu navegador.</p>
        
        <div class="drop-zone">
            <input type="file" id="video-input" accept=".avi" hidden>
            <label for="video-input" class="file-label">Selecciona o arrastra tu archivo .avi</label>
            <div id="file-name" class="file-name"></div>
        </div>

        <button id="convert-btn" disabled>Convertir a MP4</button>

        <div class="progress-container" id="progress-container" style="display: none;">
            <div class="status" id="status-text">Cargando convertidor...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div id="download-container" style="display: none;">
            <a id="download-link" class="download-btn" download="video.mp4">Descargar MP4</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
