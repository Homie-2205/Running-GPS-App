<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .track-subtitle {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="track-title">Jazz Instrumental</div>
        <div class="track-subtitle">bill.mp3</div>
        <audio controls>
            <source src="https://running-gps-app-cobc.onrender.com/sound/bill.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

</body>
</html>
