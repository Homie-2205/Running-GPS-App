<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Chat Application</title>
  <!-- Load the official Agora Chat SDK from CDN -->
  <script src="https://agora.io"></script>
  <script src="https://agora.io"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f5f7fb; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { color: #096dd9; margin-top: 0; }
    label { display: block; margin: 10px 0 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #d9d9d9; border-radius: 4px; margin-bottom: 10px; }
    button { background-color: #1890ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
    button:hover { background-color: #40a9ff; }
    #status { padding: 10px; border-radius: 4px; background: #e6f7ff; border: 1px solid #91d5ff; color: #1890ff; margin-bottom: 20px; font-weight: bold; }
    #log { background: #1e1e1e; color: #a9b7c6; font-family: monospace; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; font-size: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Agora Chat Credentials</h2>
    <p>Using project app configuration strings.</p>
    <div id="status">Status: Disconnected</div>
  </div>

  <!-- Authentication Card -->
  <div class="card" id="authSection">
    <h3>Step 1: Authenticate Connection</h3>
    <label for="userId">Your User ID</label>
    <input type="text" id="userId" placeholder="Enter the exact User ID bound to your token" value="">
    <button id="loginBtn">Connect to Agora Chat</button>
  </div>

  <!-- Messenger Card (Disabled until login success) -->
  <div class="card" id="messagingSection" style="opacity: 0.5; pointer-events: none;">
    <h3>Step 2: Send a Message</h3>
    <label for="recipientId">Recipient User ID</label>
    <input type="text" id="recipientId" placeholder="Target User ID">
    
    <label for="messageText">Message Body</label>
    <textarea id="messageText" rows="3" placeholder="Type a chat message..."></textarea>
    
    <button id="sendBtn">Send Message</button>
  </div>

  <!-- Debug Console Logger -->
  <div class="card">
    <h3>System Logs</h3>
    <div id="log">Console initialized...</div>
  </div>

  <script>
    // System Configurations
    const AGORA_APP_ID = "e4fd483a899746719051a0cfe66641c5";
    const AGORA_API_URL = "6811d722de9f4ffe9665701d7adc8283";
    const USER_TOKEN = "007eJxTYKif4uUp1L3S7F7j1iPbOGayT+VSaBGXl//rpuk9SUhjHasCQ6pJWoqJhXGihaWluYmZuaGlgalhokFyWqqZmZmJYbJpVsmhrIZARoYcb34WJgZGMATxeRhSUnPzdZMzEvPyUnMYGJjgMiwMhgYGhgDxSh96";

    // Setup UI Element References
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const loginBtn = document.getElementById('loginBtn');
    const sendBtn = document.getElementById('sendBtn');
    const userIdInput = document.getElementById('userId');
    const recipientIdInput = document.getElementById('recipientId');
    const messageTextInput = document.getElementById('messageText');
    const messagingSection = document.getElementById('messagingSection');

    // Helper Logger Function
    function appendLog(text) {
      logDiv.innerHTML += `<br/>[${new Date().toLocaleTimeString()}] ${text}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Initialize Web SDK Client Instance
    appendLog("Initializing Web SDK client configuration...");
    const conn = new WebIM.connection({
      appId: AGORA_APP_ID,
      apiUrl: AGORA_API_URL
    });

    // Event Listener Registry
    conn.addEventHandler("CONNECTION_EVENTS", {
      onConnected: () => {
        statusDiv.innerText = "Status: Connected successfully";
        statusDiv.style.background = "#f6ffed";
        statusDiv.style.borderColor = "#b7eb8f";
        statusDiv.style.color = "#52c41a";
        appendLog("WebSocket connected to Agora signaling servers.");
        
        // Unlock Message UI
        messagingSection.style.opacity = "1";
        messagingSection.style.pointer-events = "auto";
      },
      onDisconnected: () => {
        statusDiv.innerText = "Status: Disconnected";
        statusDiv.style.background = "#fff1f0";
        statusDiv.style.borderColor = "#ffa39e";
        statusDiv.style.color = "#f5222d";
        appendLog("Disconnected from server environment.");
      },
      onTextMessage: (message) => {
        appendLog(`Received message from ${message.from}: ${message.msg}`);
      },
      onError: (error) => {
        appendLog(`SDK error event triggered: ${JSON.stringify(error)}`);
      }
    });

    // Execute Login Routing
    loginBtn.addEventListener('click', () => {
      const user = userIdInput.value.trim();
      if (!user) {
        alert("Please enter a User ID before connecting.");
        return;
      }

      appendLog(`Attempting authentication sequence for user: ${user}`);
      conn.open({
        user: user,
        accessToken: USER_TOKEN
      });
    });

    // Execute Sending Text
    sendBtn.addEventListener('click', () => {
      const targetUser = recipientIdInput.value.trim();
      const textBody = messageTextInput.value.trim();

      if (!targetUser || !textBody) {
        alert("Please complete both recipient ID and message body.");
        return;
      }

      appendLog(`Packaging structural text data payload for destination: ${targetUser}`);
      
      let msgOptions = {
        chatType: 'singleChat',
        type: 'txt',
        to: targetUser,
        msg: textBody
      };

      let msg = WebIM.message.create(msgOptions);

      conn.send(msg)
        .then(() => {
          appendLog(`Dispatched message to ${targetUser} successfully.`);
          messageTextInput.value = ''; // Reset message input layout
        })
        .catch((err) => {
          appendLog(`Failed dispatch workflow structure: ${err.message || err}`);
        });
    });
  </script>
</body>
</html>
