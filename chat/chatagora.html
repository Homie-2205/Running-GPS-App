<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agora RTM — Peer Chat Demo</title>
  <!-- Agora RTM Web SDK -->
  <script src="https://cdn.agora.io/sdk/release/AgoraRTMSDK-1.5.0.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f3f6fb;margin:0}
    .card{width:min(680px,96vw);background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 10px 30px rgba(2,6,23,.08)}
    h2{color:#0b63d6;margin:0 0 12px}
    .row{display:flex;gap:10px;margin-bottom:10px}
    input,textarea,button{font:inherit}
    input,textarea{padding:10px;border:1px solid #e6eef8;border-radius:8px;flex:1}
    textarea{min-height:84px;resize:vertical}
    button{background:#0b63d6;color:white;padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
    #log{background:#0b1122;color:#dbeafe;padding:10px;border-radius:8px;min-height:80px;max-height:200px;overflow:auto;font-family:monospace;font-size:13px}
    .muted{color:#6b7280;font-size:13px}
    .flex{display:flex;gap:8px}
    label{font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Agora RTM — Peer-to-Peer Chat Demo</h2>

    <p class="muted">This demo uses Agora RTM Web SDK. It logs in using the APP ID and token embedded below and sends peer-to-peer messages (use two browsers or devices, different user IDs).</p>

    <div style="margin-top:12px">
      <div class="row">
        <div style="flex:1">
          <label for="userId">Your User ID</label>
          <input id="userId" placeholder="e.g. alice" />
        </div>
        <div style="width:180px">
          <label>&nbsp;</label>
          <button id="loginBtn">Connect</button>
        </div>
      </div>

      <div id="status" class="muted">Status: disconnected</div>

      <hr style="margin:14px 0" />

      <div class="row">
        <div style="flex:1">
          <label for="recipientId">Recipient ID</label>
          <input id="recipientId" placeholder="e.g. bob" />
        </div>
      </div>

      <div style="margin-top:8px">
        <label for="messageText">Message</label>
        <textarea id="messageText" placeholder="Type a message..."></textarea>
      </div>

      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="sendBtn">Send to Peer</button>
        <button id="logoutBtn" style="background:#ef4444">Logout</button>
      </div>

      <div style="margin-top:14px">
        <div id="log">Logs will appear here...</div>
      </div>

    </div>
  </div>

  <script>
    // ----- CONFIG: Replace if you want different values -----
    const AGORA_APP_ID = "e4fd483a899746719051a0cfe66641c5"; // last used in repo
    const AGORA_API_URL = "6811d722de9f4ffe9665701d7adc8283"; // kept for reference (not used by RTM client)
    const USER_TOKEN = "007eJxTYKif4uUp1L3S7F7j1iPbOGayT+VSaBGXl//rpuk9SUhjHasCQ6pJWoqJhXGihaWluYmZuaGlgalhokFyWqqZmZmJYbJpVsmhrIZARoYcb34WJgZGMATxeRhSUnPzdZMzEvPyUnMYGJjgMiwMhgYGhgDxSh96"; // last token string from file
    // --------------------------------------------------------

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const sendBtn = document.getElementById('sendBtn');
    const userIdInput = document.getElementById('userId');
    const recipientIdInput = document.getElementById('recipientId');
    const messageTextInput = document.getElementById('messageText');
    const logDiv = document.getElementById('log');
    const statusDiv = document.getElementById('status');

    let rtmClient = null;
    let currentUser = null;

    function appendLog(msg) {
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML = `[${time}] ${msg}\n` + logDiv.innerHTML;
    }

    function setStatus(text) {
      statusDiv.textContent = 'Status: ' + text;
    }

    async function login() {
      const user = userIdInput.value.trim();
      if (!user) { alert('Enter your user ID'); return; }

      appendLog('Initializing Agora RTM client...');
      rtmClient = AgoraRTM.createInstance(AGORA_APP_ID);

      rtmClient.on('ConnectionStateChanged', (newState, reason) => {
        appendLog(`RTM connection state: ${newState} (${reason || 'no reason'})`);
        if (newState === 'ABORTED' || newState === 'DISCONNECTED') setStatus('disconnected');
      });

      rtmClient.on('MessageFromPeer', (message, peerId) => {
        // message: { text }
        const text = message && message.text ? message.text : JSON.stringify(message);
        appendLog(`Received from ${peerId}: ${text}`);
      });

      try {
        appendLog(`Logging in as: ${user}`);
        await rtmClient.login({ uid: user, token: USER_TOKEN });
        currentUser = user;
        setStatus('connected as ' + user);
        appendLog('Login successful. You can now send peer messages');
      } catch (err) {
        appendLog('Login failed: ' + (err.message || err));
        setStatus('login failed');
      }
    }

    async function logout() {
      if (!rtmClient) return;
      try {
        await rtmClient.logout();
        appendLog('Logged out');
      } catch (e) {
        appendLog('Logout error: ' + (e.message || e));
      }
      rtmClient = null;
      currentUser = null;
      setStatus('disconnected');
    }

    async function sendPeerMessage() {
      if (!rtmClient || !currentUser) { alert('Please connect first'); return; }
      const to = recipientIdInput.value.trim();
      const text = messageTextInput.value.trim();
      if (!to) { alert('Enter recipient ID'); return; }
      if (!text) { alert('Enter a message'); return; }

      try {
        appendLog(`Sending to ${to}: ${text}`);
        const res = await rtmClient.sendMessageToPeer({ text }, to);
        // res has a 'hasPeerReceived' boolean in some SDK versions, but we treat as success
        appendLog('Message sent');
        messageTextInput.value = '';
      } catch (e) {
        appendLog('Failed to send: ' + (e.message || e));
      }
    }

    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendPeerMessage);

    // Support Enter to send
    messageTextInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        sendPeerMessage();
      }
    });

    appendLog('Page ready. Enter user ID and click Connect');
  </script>
</body>
</html>
