<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple 2-User Chat</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe7f5;
      --mine: #dbeafe;
      --other: #f3f4f6;
      --success: #16a34a;
      --error: #dc2626;
      --shadow: rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .app {
      width: min(560px, 92vw);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 18px 30px var(--shadow);
      padding: 20px;
    }

    h2 {
      margin: 0 0 18px;
      color: var(--primary);
      font-size: 1.4rem;
      text-align: center;
    }

    .status {
      background: #eef6ff;
      color: #0f3d7a;
      border: 1px solid #cfe5ff;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, textarea, button {
      width: 100%;
      border-radius: 10px;
      font: inherit;
    }

    input, textarea {
      border: 1px solid var(--border);
      padding: 10px 12px;
      outline: none;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 11px 12px;
      font-weight: 700;
      color: white;
      background: var(--primary);
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #111827;
    }

    .secondary:hover {
      background: #1f2937;
    }

    .chat-box {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f9fbff;
      min-height: 220px;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .msg.mine {
      align-self: flex-end;
      background: var(--mine);
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--other);
      border-bottom-left-radius: 4px;
    }

    .meta {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>Local 2-User Chat</h2>

    <div id="status" class="status">Status: Not connected</div>

    <div id="loginSection" class="grid">
      <div>
        <label for="userId">Your name</label>
        <input id="userId" type="text" placeholder="Example: alice" />
      </div>
      <button id="joinBtn">Join Chat</button>
    </div>

    <div id="chatSection" class="hidden">
      <div class="grid" style="margin-top: 18px;">
        <div>
          <label for="recipientId">Send to</label>
          <input id="recipientId" type="text" placeholder="Example: bob" />
        </div>
        <div>
          <label for="messageText">Message</label>
          <textarea id="messageText" placeholder="Type your message here..."></textarea>
        </div>
        <button id="sendBtn">Send Message</button>
      </div>

      <div id="chatBox" class="chat-box" aria-live="polite"></div>
    </div>

    <div class="muted">Open this page in two browser tabs/windows and use two different names.</div>
  </div>

  <script>
    const CHANNEL_NAME = 'simple_chat_demo_2_users';
    const channel = new BroadcastChannel(CHANNEL_NAME);

    const statusEl = document.getElementById('status');
    const loginSection = document.getElementById('loginSection');
    const chatSection = document.getElementById('chatSection');
    const joinBtn = document.getElementById('joinBtn');
    const sendBtn = document.getElementById('sendBtn');
    const userIdInput = document.getElementById('userId');
    const recipientIdInput = document.getElementById('recipientId');
    const messageTextInput = document.getElementById('messageText');
    const chatBox = document.getElementById('chatBox');

    let currentUser = '';

    function setStatus(text) {
      statusEl.textContent = 'Status: ' + text;
    }

    function addMessage(from, text, isMine) {
      const row = document.createElement('div');
      row.className = 'msg ' + (isMine ? 'mine' : 'other');

      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = isMine ? 'You' : from;

      const body = document.createElement('div');
      body.textContent = text;

      row.appendChild(meta);
      row.appendChild(body);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function joinChat() {
      const user = userIdInput.value.trim();
      if (!user) {
        alert('Please enter your name.');
        return;
      }

      currentUser = user;
      loginSection.classList.add('hidden');
      chatSection.classList.remove('hidden');
      setStatus('Connected as ' + currentUser);
      recipientIdInput.focus();
    }

    function sendMessage() {
      if (!currentUser) return;

      const recipient = recipientIdInput.value.trim();
      const text = messageTextInput.value.trim();

      if (!recipient) {
        alert('Please enter the recipient name.');
        return;
      }

      if (!text) {
        alert('Please type a message.');
        return;
      }

      const message = {
        type: 'chat-message',
        from: currentUser,
        to: recipient,
        text: text
      };

      channel.postMessage(message);
      addMessage(currentUser, text, true);
      messageTextInput.value = '';
      messageTextInput.focus();
    }

    joinBtn.addEventListener('click', joinChat);
    sendBtn.addEventListener('click', sendMessage);

    messageTextInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    channel.onmessage = (event) => {
      const message = event.data;
      if (!message || message.type !== 'chat-message') return;
      if (message.from === currentUser) return;
      if (message.to && message.to !== currentUser && message.to !== 'all') return;

      addMessage(message.from, message.text, false);
      setStatus('Incoming message from ' + message.from);
    };

    window.addEventListener('beforeunload', () => {
      channel.close();
    });
  </script>
</body>
</html>
