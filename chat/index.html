<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora Peer Chat</title>
    <!-- 1. Import Agora Chat SDK Web Library -->
    <script src="https://agora.io"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; }
        .box { margin-bottom: 15px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        #chat-log { height: 150px; overflow-y: scroll; background: #f4f4f4; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Agora P2P Chat</h2>

    <!-- Login Section -->
    <div class="box">
        <h3>1. Login</h3>
        <input type="text" id="username" placeholder="Your Username (e.g. alex)">
        <button id="login-btn">Log In</button>
        <p id="status">Status: Disconnected</p>
    </div>

    <!-- Chat Messaging Section -->
    <div class="box">
        <h3>2. Send Message</h3>
        <input type="text" id="peer-id" placeholder="Receiver Username (e.g. sam)">
        <input type="text" id="message-text" placeholder="Type a message...">
        <button id="send-btn" disabled>Send</button>
        
        <h4>Chat Log:</h4>
        <div id="chat-log"></div>
    </div>

    <!-- Link your custom logic script -->
    <script src="main.js"></script>
</body>
</html>
