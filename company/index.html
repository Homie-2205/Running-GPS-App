<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company - Repartidor</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#f7f7f7; display:grid; place-items:center; min-height:100vh; }
    .card { background:#fff; border-radius:12px; padding:28px; width:min(92vw,500px); box-shadow:0 8px 24px rgba(0,0,0,.12); text-align:center; }
    h1 { margin:0 0 12px; color:#222; }
    p { color:#555; margin:0 0 18px; }
    .btn { display:inline-block; width:100%; padding:12px 16px; margin-top:10px; border-radius:10px; border:none; cursor:pointer; font-weight:700; }
    .btn-primary { background:#ffd480; color:#1a1100; }
    .btn-secondary { background:#fff1c1; color:#1a1100; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Repartidor</h1>
    <p>Pulsa el botón para abrir la página del repartidor y reproducir el audio en el móvil.</p>

    <!-- Opens the repartidor page and passes the Drive file ID as a parameter -->
    <button id="openRepartidor" class="btn btn-primary" type="button">Abrir reproductor (repartidor)</button>

    <!-- Opens the Google Drive viewer in a new tab -->
    <button id="openDrive" class="btn btn-secondary" type="button">Abrir archivo en Google Drive</button>
  </div>

  <script>
    // Replace with your Drive file ID if different
    const driveId = '1BrQhl2e-mM1DhMUv1hSpTULSD91ffMSz';
    const driveViewerUrl = 'https://drive.google.com/file/d/' + driveId + '/view?usp=sharing';

    document.getElementById('openRepartidor').addEventListener('click', () => {
      // Navigate to the repartidor page and pass the driveId as a query parameter
      window.location.href = '../repartidor/repartidor.html?driveId=' + encodeURIComponent(driveId);
    });

    document.getElementById('openDrive').addEventListener('click', () => {
      // Open the Drive viewer in a new tab
      window.open(driveViewerUrl, '_blank', 'noopener');
    });
  </script>
</body>
</html>
