<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Botón de sonido remoto</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 14px; min-height:100vh; display:flex; justify-content:center; align-items:center; background:#eef2f6; color:#17212b; font-family:Arial,sans-serif; }
    main { width:100%; max-width:520px; padding:25px; background:#fff; border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.09); text-align:center; }
    h1 { font-size:25px; margin-top:0; }
    p { line-height:1.5; }
    button { width:100%; border:0; border-radius:12px; padding:15px 12px; margin:8px 0; font-size:16px; font-weight:700; color:white; background:#1769aa; cursor:pointer; }
    button.dark { background:#344454; } button.green { background:#16804a; }
    #status { margin-top:16px; padding:12px; background:#f2f5f8; border-radius:10px; min-height:48px; overflow-wrap:anywhere; }
    .small { font-size:13px; color:#536170; }
  </style>
</head>
<body>
<main>
  <h1>🔔 Botón de sonido remoto</h1>
  <p>Abre esta misma URL pública de Render en ambos celulares.</p>
  <button id="ownerBtn" class="green">1. ACTIVAR ESTE CELULAR COMO RECEPTOR</button>
  <button id="enableBtn" class="dark">2. ACTIVAR / PROBAR SONIDO</button>
  <button id="callBtn">ENVIAR SOLICITUD DE SONIDO</button>
  <p id="status" role="status">Conectando con el servidor…</p>
  <p class="small">En el celular receptor, activa el modo receptor y prueba el sonido una vez. Mantén la página abierta y conectada a Internet.</p>
</main>

<audio id="ring" preload="auto">
  <source src="https://drive.google.com/uc?export=download&amp;id=1BrQhl2e-mM1DhMUv1hSpTULSD91ffMSz" type="audio/mpeg">
</audio>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();
  const status = document.getElementById("status");
  const audio = document.getElementById("ring");
  let ownerMode = new URLSearchParams(location.search).get("mode") === "owner";
  let audioEnabled = false;
  function message(text) { status.textContent = text; }

  async function playRing() {
    try {
      audio.pause();
      audio.currentTime = 0;
      await audio.play();
      message("🔔 Reproduciendo el MP3 en este celular.");
    } catch (error) {
      message("La solicitud llegó, pero el audio no pudo reproducirse. Revisa el acceso de Google Drive y pulsa ACTIVAR / PROBAR SONIDO.");
    }
  }

  function registerOwner() {
    ownerMode = true;
    if (socket.connected) socket.emit("owner:join");
    message("Modo receptor activado. Pulsa ACTIVAR / PROBAR SONIDO una vez.");
  }

  document.getElementById("ownerBtn").addEventListener("click", registerOwner);
  document.getElementById("enableBtn").addEventListener("click", async () => {
    audioEnabled = true;
    await playRing();
  });
  document.getElementById("callBtn").addEventListener("click", () => {
    if (!socket.connected) return message("Sin conexión con Render. Comprueba Internet e intenta de nuevo.");
    socket.emit("visitor:call");
    message("Enviando solicitud al celular receptor…");
  });

  socket.on("connect", () => {
    if (ownerMode) socket.emit("owner:join");
    else message("Conectado al servidor público de Render.");
  });
  socket.on("disconnect", () => message("Desconectado. Intentando reconectar…"));
  socket.on("server:status", message);
  socket.on("owner:play-sound", () => {
    if (!ownerMode) return;
    if (!audioEnabled) return message("Solicitud recibida. Primero pulsa ACTIVAR / PROBAR SONIDO en este celular.");
    playRing();
  });
  socket.on("visitor:result", (result) => message(result.message));

  if (ownerMode) socket.on("connect", () => socket.emit("owner:join"));
})();
</script>
</body>
</html>
