<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote MP3 Player</title>
</head>
<body>
    <h2>Remote MP3 Player</h2>

    <button onclick="openMP3()">
        OPEN MP3 ON MY PHONE
    </button>

    <p id="status">Waiting...</p>

    <script>
        async function openMP3() {
            const status = document.getElementById("status");

            try {
                const response = await fetch("/open-mp3", {
                    method: "POST"
                });

                const data = await response.json();
                status.textContent = data.message;
            } catch (error) {
                status.textContent = "Connection error.";
            }
        }
    </script>

    <hr>

    <h3>Phone Receiver</h3>

    <p>Open this page on your cellphone first.</p>

    <button onclick="startReceiver()">
        ACTIVATE PHONE RECEIVER
    </button>

    <script>
        let receiver;

        function startReceiver() {
            if (receiver) return;

            receiver = new EventSource("/events");

            receiver.onmessage = function(event) {
                if (event.data === "OPEN_MP3") {
                    window.location.href = "https://drive.google.com/file/d/1BrQhl2e-mM1DhMUv1hSpTULSD91ffMSz/view?usp=sharing";
                }
            };

            document.getElementById("status").textContent =
                "Phone receiver connected.";
        }
    </script>
</body>
</html>
