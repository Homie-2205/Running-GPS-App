<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; }
        .custom-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            color: #1a1100;
            background-color: #ffd480;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .custom-button:hover { background-color: #005ce6; }
        .audio-box { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="audio-box">
        <button id="openBillBtn" class="custom-button">Open bill.mp3</button>
        <audio id="billAudio" controls preload="auto" style="display:block; margin-top: 12px; width: 320px; max-width: 100%;"></audio>
    </div>

    <script>
      const btn = document.getElementById('openBillBtn');
      const audio = document.getElementById('billAudio');

      btn.addEventListener('click', () => {
        const audioUrl = '/repartidor/bill.mp3';
        audio.src = audioUrl;
        audio.play().catch(() => {
          console.log('Playback was blocked until the user interacts with the page.');
        });
      });
    </script>
</body>
</html>
