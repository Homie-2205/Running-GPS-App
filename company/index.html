<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remote Samsung MP3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
            background: #f1f4f8;
        }

        h1 {
            color: #222;
        }

        button {
            padding: 16px 24px;
            font-size: 18px;
            background: #168447;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>My Samsung MP3</h1>

    <p>Click to open your MP3 on your connected Samsung phone.</p>

    <button id="openButton" onclick="openMP3()">
        Open MP3 on My Samsung
    </button>

    <p id="status">Ready</p>

    <script>
        async function openMP3() {
            const button = document.getElementById("openButton");
            const status = document.getElementById("status");

            button.disabled = true;
            status.textContent = "Sending command...";

            try {
                const response = await fetch("/open-mp3", {
                    method: "POST"
                });

                const result = await response.json();

                status.textContent = result.message;

            } catch (error) {
                status.textContent = "Connection error. Please try again.";
            } finally {
                button.disabled = false;
            }
        }
    </script>

</body>
</html>
