<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote MP3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f1f3f4;
            padding: 70px 15px;
        }

        button {
            padding: 20px 30px;
            font-size: 20px;
            color: white;
            background: #188038;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #status {
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <h2>Remote MP3</h2>

    <div id="phoneControls" hidden>
        <button onclick="connectPhone()">CONNECT MY PHONE</button>
    </div>

    <div id="computerControls" hidden>
        <button onclick="openOnPhone()">OPEN MP3 ON MY PHONE</button>
    </div>

    <p id="status">Connecting...</p>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const OWNER_KEY = "CHANGE_THIS_OWNER_KEY";
        const ACCESS_KEY = "CHANGE_THIS_ACCESS_KEY";
        const FILE_ID = "YOUR_GOOGLE_DRIVE_FILE_ID";

        const params = new URLSearchParams(location.search);
        const isPhone = params.get("device") === "phone";

        document.getElementById("phoneControls").hidden = !isPhone;
        document.getElementById("computerControls").hidden = isPhone;

        function connectPhone() {
            socket.emit("register-owner", OWNER_KEY);
        }

        function openOnPhone() {
            socket.emit("open-mp3", ACCESS_KEY);
        }

        socket.on("connect", () => {
            document.getElementById("status").textContent =
                "Connected to server.";
        });

        socket.on("status", (message) => {
            document.getElementById("status").textContent = message;
        });

        socket.on("open-mp3-on-phone", () => {
            const url =
                "https://drive.google.com/file/d/" +
                encodeURIComponent(FILE_ID) + "/view";

            window.location.href = url;
        });
    </script>
</body>
</html>
