<div class="form-container" style="max-width: 400px; margin: 0 auto; font-family: Arial, sans-serif; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    
    <audio id="audio2" src="your-audio-file.mp3"></audio>

    <div style="text-align: center; margin-bottom: 20px;">
        <img src="fruits/espinaca.png" style="width: 300px; height: 250px; cursor: pointer; border-radius: 8px; object-fit: cover;" alt="Hope" onclick="document.getElementById('audio2').play()">
    </div>

    <!-- PASTE YOUR GOOGLE SCRIPT URL IN THE ACTION ATTRIBUTE BELOW -->
    <form id="dataForm" action="https://script.google.com/macros/s/AKfycbzzsT61fbKuoUKTVQQJBVbtdMkupzRo6cJ8AOha_GG38qw1RYuib8owtBIRVc_V-RYn/exec" method="POST">
        <h2 id="banano" style="margin-top: 10px; color: #333; text-align: center;">Espinaca</h2>
        
        <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="username" style="display: block; font-weight: bold; margin-bottom: 5px;">Nombre:</label> 
            <input type="text" id="username" name="username" placeholder="Ej. Juan Pérez" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="address" style="display: block; font-weight: bold; margin-bottom: 5px;">Dirección:</label> 
            <input type="text" id="address" name="address" placeholder="Ej. Calle 10 #2-3" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="neighborhood" style="display: block; font-weight: bold; margin-bottom: 5px;">Barrio:</label> 
            <input type="text" id="neighborhood" name="neighborhood" placeholder="Ej. San Fernando" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="cellphone" style="display: block; font-weight: bold; margin-bottom: 5px;">Teléfono:</label> 
            <input type="tel" id="cellphone" name="cellphone" placeholder="Ej. 3001234567" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="weight" style="display: block; font-weight: bold; margin-bottom: 5px;">¿Cuántos kilos deseas?</label> 
            <input type="number" id="weight" name="weight" min="0.1" step="0.1" value="1.0" oninput="recalculatePrice()" style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <div class="total-box" style="margin: 15px 0; font-weight: bold; font-size: 1.2em; text-align: center;"> 
            Total: $<span id="totalPrice">4.500</span> COP 
        </div> 
        
         <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="text" style="display: block; font-weight: bold; margin-bottom: 5px;">Confirma la Fruta</label> 
            <input type="text" id="text" name="text" placeholder="Escribe la fruta de nuevo" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
         <div class="form-group" style="margin-bottom: 15px;"> 
            <label for="price" style="display: block; font-weight: bold; margin-bottom: 5px;">Confirma el Precio</label> 
            <input type="text" id="price" name="price" placeholder="Escribe de nuevo el precio" required style="width: 100%; padding: 8px; box-sizing: border-box;"> 
        </div> 
        
        <button type="submit" id="submitBtn" style="background-color: #25D366; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%;">
            Enviar Pedido
        </button>
    </form>

    <div id="message" style="margin-top: 15px; font-weight: bold; text-align: center; display: none;"></div>
</div>

<script>
const PRICE_PER_KILO = 4500;

function recalculatePrice() {
    const pesoInput = document.getElementById('weight').value;
    const precioTotalSpan = document.getElementById('totalPrice');
    
    const currentWeight = parseFloat(pesoInput) || 0;
    const finalPrice = currentWeight * PRICE_PER_KILO;
    
    precioTotalSpan.textContent = finalPrice.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
</script>

<script>
(function() {
    const form = document.getElementById('dataForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); 

        submitBtn.disabled = true;
        messageDiv.style.display = "block";
        messageDiv.textContent = "Enviando pedido...";
        messageDiv.style.color = "black";

        // Convert form data directly to a clean URL search string format for Google Apps script
        const formData = new FormData(form);
        const urlEncodedData = new URLSearchParams();
        for (const pair of formData) {
            urlEncodedData.append(pair[0].trim(), pair[1]);
        }

        // Sending with method POST to Google Web App script URL
        fetch(form.action, {
            method: 'POST',
            mode: 'cors', // Enable standard cors handling for web app json response
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: urlEncodedData.toString()
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'success') {
                messageDiv.textContent = "¡Pedido registrado con éxito!";
                messageDiv.style.color = "green";
                form.reset();
                
                if (typeof recalculatePrice === "function") {
                    recalculatePrice();
                }
                
                setTimeout(() => {
                    messageDiv.style.display = "none";
                }, 3500);
            } else {
                throw new Error(data.error || 'Unknown sheet writing issue.');
            }
        })
        .catch(error => {
            messageDiv.textContent = "Error al enviar. Por favor intente de nuevo.";
            messageDiv.style.color = "red";
            console.error("Submission Error Details:", error); 
        })
        .finally(() => {
            submitBtn.disabled = false;
        });
    });
})();
</script>
