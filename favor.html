    <style>
/* ==========================================================================
   RESET & GLOBAL STYLES
   ========================================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* ==========================================================================
   CONTACT SECTION & CENTERED FORM
   ========================================================================== */
.contact-section {
    width: 100%;
    max-width: 1200px;
    padding: 40px 20px;
    margin: 0 auto; 
}

.contact-container {
    display: flex;
    justify-content: center; 
    align-items: center;
    gap: 50px;
    flex-wrap: wrap; 
}

.contact-textm, .contact-text {
    flex: 1;
    min-width: 300px;
    text-align: center; 
}

.contact-textm h1, .contact-text h1 {
    font-size: 3.5rem;
    font-weight: 500;
    line-height: 1.2;
    color: #333;
}

.contact-text .highlight {
    position: relative;
    display: inline-block;
}

.contact-form {
    flex: 0 1 600px; 
    min-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center; 
    gap: 20px; 
    margin: 0 auto;
}

.inputs-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%; 
    align-items: center;
}

.input-group {
    width: 100%;
    display: flex;
    justify-content: center;
}

.input-group input {
    width: 100%;
    padding: 25px 30px; 
    font-size: 1.1rem;
    border: 2px solid #ffd700; 
    border-radius: 25px; 
    background-color: #fcf9f5; 
    color: #333333;
    outline: none;
    transition: all 0.3s ease;
}

.input-group input:focus {
    border-color: #ffcc00; 
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); 
    background-color: #ffffff;
}

/* Desktop Width Refinement */
@media (min-width: 1300px) {
    .input-group input, .custom-button {
        width: 800px;
        max-width: 100%;
    }
}

/* ==========================================================================
   NAVIGATION & HEADER
   ========================================================================== */
@media (max-width: 450px) {
    .nav-links {
        display: none;
    }
}

.nav-links li {
    margin-right: 1.5rem;
}

.nav-links a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
    margin-right: 1.5rem;
}

.nav-links a:hover {
    color: #00adb5;
}

.hero-header {
    background-image: url("I.gif");
    text-align: center;
    padding: 4rem 2rem;
    border-bottom: 1px solid #ddd;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    margin: 0;
    height: 60vh;
}

.hero-header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #222;
}

/* ==========================================================================
   COMPONENTS & UI ELEMENTS (SUBMIT BUTTON)
   ========================================================================== */
.lang-link {
    color: #334155;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    display: inline-flex; 
    align-items: center; 
    gap: 0.3rem;
    padding: 0.3rem 0.6rem;
    border-radius: 0.375rem;
    transition: all 0.2s ease;
}

.main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.lang-list {
    display: flex;
    list-style: none;               
    margin: 0 0 0 3rem; 
    padding: 0;
    gap: 1rem;          
}

.custom-button {
    display: inline-block;
    width: 100%; 
    padding: 28px 24px; /* 28px top and bottom padding */
    font-family: 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    color: #1a1100;
    background-color: #ffd480;
    border: none;
    border-radius: 25px; 
    cursor: pointer;
    user-select: none;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.custom-button:hover {
    background-color: #005ce6;
    color: #ffffff; 
}

.custom-button:active {
    transform: scale(0.98);
}

.custom-button:focus-visible {
    outline: 3px solid #80bfff;
    outline-offset: 2px;
}

/* ==========================================================================
   CONTENT TYPOGRAPHY
   ========================================================================== */
.content-text h2 {
    font-size: 2rem;
    color: #333;
    margin-bottom: 0.5rem;
    font-family: Georgia, Serif;
    letter-spacing: 5px;
    font-weight: 180;
    text-align: center;
}

.content-text h3 {
    font-size: 1.3rem;
    color: #666;
    margin-bottom: 1rem;
    font-family: Georgia, Serif;
    font-weight: 160;
    text-align: center;

.content-text p {
    font-size: 1.1rem;
    line-height: 1.6;

    font-family: Georgia, Serif;
    text-align: center;

.container-section {
    padding-top: 40px;

.content-text {
    text-align: center;

/* ==========================================================================

.site-footer {

    background-color: #ffd480;
    color: #fff;
    text-align: center;     
    padding: 20px 0;        
    box-sizing: border-box; 
}

.site-footer p {
    margin: 0;

            <!-- Ensure the URL matches your deployed Web App URL exactly -->
            <form id="dataForm" action="https://script.google.com/macros/s/AKfycbxyi38SbsRy6iejN2FQLp109Bm0Bkz2sfhEf33KzY0wvvlZEvQB3MJwqbaWLUfU8guoKg/exec" method="POST">

                    <!-- FIXED: Cleaned up inline style quotes -->

                </div>

                <div class="input-group">
                    <!-- FIXED: Cleaned up inline style quotes -->
                    <input style="margin-top: 20px;" type="tel" id="cellphone" name="cellphone" placeholder="Celular">
                </div>

                <div class="input-group">
                    <!-- FIXED: Cleaned up inline style quotes -->

                </div>

                <div class="input-group">
                    <!-- FIXED: Cleaned up inline style quotes -->

                </div>

               <div class="input-group">
                    <!-- FIXED: Cleaned up inline style quotes -->

                </div>


                <div> 
                   <button type="submit" id="submitBtn" class="custom-button" style="cursor: pointer; width: 140px; margin-top: 28px;">Pedir</button>


<div id="message"></div>



<script>
const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    e.preventDefault(); 

    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    // This now works perfectly because the inputs have "name" attributes
    const formData = new FormData(form);
    
    // Convert to URL parameters required by Google Apps Script
    const urlEncodedData = new URLSearchParams();
    for (const pair of formData) {
        urlEncodedData.append(pair[0], pair[1]);
    }

    fetch(form.action, {
        method: 'POST',
        mode: 'no-cors', // Required for Google Apps Script
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncodedData.toString()
    })
    .then(() => {
        messageDiv.textContent = "Data submitted successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        messageDiv.textContent = "Error submitting data. Please check connection.";
        messageDiv.style.color = "red";
        console.error("Submission Error Details:", error); 
    })
    .finally(() => {
        submitBtn.disabled = false;
    });
});
</script>

  // Selecciona tu etiqueta <nav> por su ID (asegúrate de que tu <nav id="navbar"> tenga este ID)

  window.addEventListener('scroll', () => {
    // Si el usuario baja más de 50 píxeles, añade la clase de fondo amarillo
    if (window.scrollY > 50) {
      navbar.classList.add('scrolled');
    } else {
      // Si regresa al inicio de la página, vuelve a ser transparente
      navbar.classList.remove('scrolled');
    }
  });
