<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

       <style>
/* ==========================================================================
   RESET & GLOBAL STYLES
   ========================================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* ==========================================================================
   CONTACT SECTION & CENTERED FORM
   ========================================================================== */
.contact-section {
    width: 100%;
    max-width: 1200px;
    padding: 40px 20px;
    margin: 0 auto; 
}

.contact-container {
    display: flex;
    justify-content: center; 
    align-items: center;
    gap: 50px;
    flex-wrap: wrap; 
}

.contact-textm, .contact-text {
    flex: 1;
    min-width: 300px;
    text-align: center; 
}

.contact-textm h1, .contact-text h1 {
    font-size: 3.5rem;
    font-weight: 500;
    line-height: 1.2;
    color: #333;
}

.contact-text .highlight {
    position: relative;
    display: inline-block;
}

.contact-form {
    flex: 0 1 600px; 
    min-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center; 
    gap: 20px; 
    margin: 0 auto;
}

.inputs-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%; 
    align-items: center;
}

.input-group {
    width: 100%;
    display: flex;
    justify-content: center;
}

.input-group input {
    width: 100%;
    padding: 25px 30px; 
    font-size: 1.1rem;
    border: 2px solid #ffd700; 
    border-radius: 25px; 
    background-color: #fcf9f5; 
    color: #333333;
    outline: none;
    transition: all 0.3s ease;
}

.input-group input:focus {
    border-color: #ffcc00; 
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); 
    background-color: #ffffff;
}

/* Desktop Width Refinement */
@media (min-width: 1300px) {
    .input-group input, .custom-button {
        width: 800px;
        max-width: 100%;
    }
}

/* ==========================================================================
   NAVIGATION & HEADER
   ========================================================================== */
@media (max-width: 450px) {
    .nav-links {
        display: none;
    }
}

.nav-links li {
    margin-right: 1.5rem;
}

.nav-links a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
    margin-right: 1.5rem;
}

.nav-links a:hover {
    color: #00adb5;
}

.hero-header {
    background-image: url("I.gif");
    text-align: center;
    padding: 4rem 2rem;
    border-bottom: 1px solid #ddd;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    margin: 0;
    height: 60vh;
}

.hero-header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #222;
}

/* ==========================================================================
   COMPONENTS & UI ELEMENTS (SUBMIT BUTTON)
   ========================================================================== */
.lang-link {
    color: #334155;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    display: inline-flex; 
    align-items: center; 
    gap: 0.3rem;
    padding: 0.3rem 0.6rem;
    border-radius: 0.375rem;
    transition: all 0.2s ease;
}

.main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.lang-list {
    display: flex;
    list-style: none;               
    margin: 0 0 0 3rem; 
    padding: 0;
    gap: 1rem;          
}

.custom-button {
    display: inline-block;
    width: 100%; 
    padding: 28px 24px; /* 28px top and bottom padding */
    font-family: 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    color: #1a1100;
    background-color: #ffd480;
    border: none;
    border-radius: 25px; 
    cursor: pointer;
    user-select: none;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.custom-button:hover {
    background-color: #005ce6;
    color: #ffffff; 
}

.custom-button:active {
    transform: scale(0.98);
}

.custom-button:focus-visible {
    outline: 3px solid #80bfff;
    outline-offset: 2px;
}

/* ==========================================================================
   CONTENT TYPOGRAPHY
   ========================================================================== */
.content-text h2 {
    font-size: 2rem;
    color: #333;
    margin-bottom: 0.5rem;
    font-family: Georgia, Serif;
    letter-spacing: 5px;
    font-weight: 180;
    text-align: center;
}

.content-text h3 {
    font-size: 1.3rem;
    color: #666;
    margin-bottom: 1rem;
    font-family: Georgia, Serif;
    font-weight: 160;
    text-align: center;
}

.content-text p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #444;
    font-family: Georgia, Serif;
    text-align: center;
}

.container-section {
    padding-top: 40px;
    padding-bottom: 40px;
}

.content-text {
    text-align: center;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */
.site-footer {
    width: 100%;
    background-color: #ffd480;
    color: #fff;
    text-align: center;     
    padding: 20px 0;        
    box-sizing: border-box; 
}

.site-footer p {
    margin: 0;              
}


    </style>
     <style>


    /* 2. Entire Screen Background Fruits Container */
    .screen-background-fruits {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Sits behind everything else */
      pointer-events: none; /* Keeps clicks from hitting the background fruits */
    }

    /* 3. Base Floating Fruit Styles */
    .fruit {
      position: absolute;
      bottom: -100px; /* Start below the visible screen */
      opacity: 0;
      user-select: none;
      animation: floatUpFullScreen 8s linear infinite;
    }

    /* 4. Staggered screen positions, sizes, and delays across the screen width */
    .apple-1      { left: 10%;  font-size: 3rem;   animation-delay: 0s;   animation-duration: 9s; }
    .banana-1     { left: 25%;  font-size: 3.5rem; animation-delay: 2s;   animation-duration: 7s; }
    .pineapple-1  { left: 40%;  font-size: 4rem;   animation-delay: 4s;   animation-duration: 10s; }
    .apple-2      { left: 60%;  font-size: 2.8rem; animation-delay: 1s;   animation-duration: 8s; }
    .banana-2     { left: 75%;  font-size: 3.8rem; animation-delay: 5s;   animation-duration: 11s; }
    .pineapple-2  { left: 90%;  font-size: 4.5rem; animation-delay: 3s;   animation-duration: 9s; }

    /* 5. Core Full-Screen Animation Logic */
    @keyframes floatUpFullScreen {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8; /* Keep it soft and ambient so it doesn't distract from the button */
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg); /* Float entirely past the top of the viewport */
        opacity: 0;
      }
    }

    /* 6. Clean, Eye-Catching Center Button */
    .center-button {
      position: relative;
      z-index: 2; /* Ensures the button sits clearly in front of the floating fruits */
      padding: 18px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(45px, #ff416c, #ff4b2b);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Button Interactivity */
    .center-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 75, 43, 0.6);
    }

    .center-button:active {
      transform: translateY(-1px) scale(1.01);
    }
  
  </style>

    <span class="fruit pineapple-1 pineapple-glow">🍲</span>

    <!-- 1. Navegación Principal -->
    <!-- Asegúrate de agregar tu <nav id="navbar"> aquí si usas el script de scroll -->

    <!-- 2. Contenedor Principal de Fotos/Contenido -->
    <div class="main-container">
        <!-- Tus fotos o contenido superior van aquí -->
    </div>

    <!-- 3. Sección del Formulario de Orden -->
    <section class="contact-section">
        <div class="contact-container">
            <div class="form-group">
                <div class="contact-form">
                    <div class="inputs-container">
                        
                        <div class="content-text">
                            <h2>Orden</h2>
                        </div>

                        <!-- Formulario conectado a Google Apps Script -->
                        <!-- NOTE: Ensure this URL matches your latest 'Deployed' Web App URL -->
                        <form id="dataForm" action="https://script.google.com/macros/s/AKfycbyjDroUiEFBS-wgBBU6SuVbTgN9NH60ls7uyRqaZAvOIcHD5ZNrOMI9hkp7I-wcWAKkBg/exec" method="POST">
                            
                            <div class="input-group">
                                <input type="text" id="cedula" name="cedula" placeholder="Pon la dirección de tu pedido y el nombre">
                            </div>
                    
                            <div class="input-group">
                                <input style="margin-top: 20px;" type="text" id="username" name="username" placeholder="Nombre de usuario">
                            </div>

                            <div class="input-group">
                                <input style="margin-top: 20px;" type="tel" id="cellphone" name="cellphone" placeholder="Celular">
                            </div>

                            <div class="input-group">
                                <input style="margin-top: 20px;" type="text" id="address" name="address" placeholder="Dirección">
                            </div>

                            <div class="input-group">
                                <input style="margin-top: 20px;" type="text" id="neighborhood" name="neighborhood" placeholder="Barrio">
                            </div>

                            <div class="input-group">
                                <input style="margin-top: 20px;" type="text" id="details" name="details" placeholder="Ponga su orden aquí y añada sustituciones">
                            </div>

                            <div> 
                                <button type="submit" id="submitBtn" class="custom-button" style="cursor: pointer; width: 140px; margin-top: 28px;">Pedir</button>
                                <div id="message" style="margin-top: 15px; font-weight: bold;"></div>
                            </div>

                        </form> <!-- Cierre correcto del Formulario -->

                    </div>
                </div>
            </div>   
        </div>
    </section> 

    <!-- 4. Pie de página (Footer) -->
    <footer class="site-footer">
        <p>&copy; 2026 MyBrand. Cristian Mauricio Arcos All rights reserved.</p>
    </footer>

  
      <script>
    const form = document.getElementById('dataForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); 

        submitBtn.disabled = true;
        messageDiv.textContent = "Submitting...";
        messageDiv.style.color = "black";

        // Captura los datos del formulario correctamente
        const formData = new FormData(form);
        const urlEncodedData = new URLSearchParams();
        for (const pair of formData) {
            urlEncodedData.append(pair[0], pair[1]);
        }

        fetch(form.action, {
            method: 'POST',
            mode: 'no-cors', // Requerido para Google Apps Script
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: urlEncodedData.toString()
        })
        .then(() => {
            messageDiv.textContent = "Data submitted successfully!";
            messageDiv.style.color = "green";
            form.reset();
        })
        .catch(error => {
            messageDiv.textContent = "Error submitting data. Please check connection.";
            messageDiv.style.color = "red";
            console.error("Submission Error Details:", error); 
        })
        .finally(() => {
            submitBtn.disabled = false;
        });
    });

    // Control de la barra de navegación al hacer scroll (Evita errores si el navbar no existe en el DOM)
    const navbar = document.getElementById('navbar');
    if (navbar) {
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    }
    </script>
