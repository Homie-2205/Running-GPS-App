<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device A - Controller</title>
    <!-- Load the Socket.io client library from your backend -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

    <h1>Device A: Remote Controller</h1>
    <p>Tap the button below to force Device B to play the song.</p>

    <button id="playBtn" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 5px;">
        Trigger Play on Device B
    </button>

    <script>
        const socket = io();
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            // Send a real-time signal to the backend
            socket.emit('send-play-signal', { action: 'play' });
            playBtn.innerText = "Signal Sent!";
            setTimeout(() => { playBtn.innerText = "Trigger Play on Device B"; }, 2000);
        });
    </script>

</body>
</html>
