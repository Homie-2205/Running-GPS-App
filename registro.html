<script>
function openExtensionPopup() {
    // 80x90 px is usually too small for browsers; 300x400 px is standard for extensions
    const width = 500; 
    const height = 700;
    
    // Position the window in the top-right corner of the screen
    const left = window.screen.width - width;
    const top = 0; 
    
    // 'popup=1' removes toolbars, address bar, and status bars in modern browsers
    const features = `width=${width},height=${height},left=${left},top=${top},popup=1,resizable=no,scrollbars=yes`;
    
    window.open('registro.html', 'extensionPopup', features);
}
</script>

<script>
const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    e.preventDefault(); 

    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    // This now works perfectly because the inputs have "name" attributes
    const formData = new FormData(form);
    
    // Convert to URL parameters required by Google Apps Script
    const urlEncodedData = new URLSearchParams();
    for (const pair of formData) {
        urlEncodedData.append(pair[0], pair[1]);
    }

    fetch(form.action, {
        method: 'POST',
        mode: 'no-cors', // Required for Google Apps Script
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncodedData.toString()
    })
    .then(() => {
        messageDiv.textContent = "Data submitted successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        messageDiv.textContent = "Error submitting data. Please check connection.";
        messageDiv.style.color = "red";
        console.error("Submission Error Details:", error); 
    })
    .finally(() => {
        submitBtn.disabled = false;
    });
});
</script>

       <script>
  // Selecciona tu etiqueta <nav> por su ID (asegúrate de que tu <nav id="navbar"> tenga este ID)
  const navbar = document.getElementById('navbar');

  window.addEventListener('scroll', () => {
    // Si el usuario baja más de 50 píxeles, añade la clase de fondo amarillo
    if (window.scrollY > 50) {
      navbar.classList.add('scrolled');
    } else {
      // Si regresa al inicio de la página, vuelve a ser transparente
      navbar.classList.remove('scrolled');
    }
  });
