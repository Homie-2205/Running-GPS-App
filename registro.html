<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <style>
        /* ==========================================================================
           1. RESET & GENERAL STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fcf9f5;
            color: #333333;
        }

        /* ==========================================================================
           2. NAVIGATION BAR
           ========================================================================== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background-color: transparent;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
            z-index: 1000;
        }
        
        nav.scrolled {
            background-color: #ffd480;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-right: 1.5rem;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
            margin-right: 1.5rem;
        }

        .nav-links a:hover {
            color: #00adb5;
        }

        .lang-list {
            display: flex;
            list-style: none;               
            margin: 0 0 0 3rem;
            padding: 0;
            gap: 1rem;
        }

        .lang-link {
            color: #334155;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.6rem;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
        }

        /* ==========================================================================
           3. HERO HEADER
           ========================================================================== */
        .hero-header {
            background-image: url("I.gif");
            text-align: center;
            padding: 4rem 2rem;
            border-bottom: 1px solid #ddd;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 60vh;
        }

        .hero-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #222;
        }

        /* ==========================================================================
           4. MAIN CONTENT & GALLERY
           ========================================================================== */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .photo-gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* ==========================================================================
           5. CENTERED CONTACT SECTION (INPUT FIELDS)
           ========================================================================== */
        .contact-section {
            width: 100%;
            max-width: 1200px;
            padding: 60px 20px;
            margin: 0 auto;
            display: flex;
            justify-content: center;  /* Centers horizontally */
            align-items: center;      /* Centers vertically */
        }

        .contact-container {
            width: 100%;
            max-width: 700px;         /* Limits width so it stays tightly centered */
            display: flex;
            flex-direction: column;
            align-items: center;      /* Centers all child items inside */
            gap: 30px;
            text-align: center;       /* Centers typography headings */
        }

        .contact-text {
            width: 100%;
        }

        .contact-text h1 {
            font-size: 3.5rem;
            font-weight: 500;
            line-height: 1.2;
            color: #333;
        }

        .contact-text .highlight {
            position: relative;
            display: inline-block;
        }

        /* Form & Input Groups */
        .contact-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 15px;                /* Consistent spacing between row fields */
            width: 100%;
        }

        .input-group {
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.1rem;
            border: 2px solid #ffd700; 
            border-radius: 25px; 
            background-color: #fcf9f5; 
            color: #333333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ffcc00; 
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); 
            background-color: #ffffff;
        }

        /* Buttons */
        .custom-button {
            display: inline-block;
            padding: 12px 24px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            color: #1a1100;
            background-color: #ffd480;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .custom-button:hover {
            background-color: #ffc44d;
        }

        /* ==========================================================================
           6. FOOTER
           ========================================================================== */
        .site-footer {
            width: 100%;
            background-color: #333; 
            color: #fff;            
            text-align: center;     
            padding: 20px 0;        
            box-sizing: border-box; 
        }

        .site-footer p {
            margin: 0;              
        }

        /* ==========================================================================
           7. RESPONSIVE MEDIA QUERIES
           ========================================================================== */
        @media (max-width: 450px) {
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <div class="logo">
            <!-- Add Logo Here -->
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
        </ul>
    </nav>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <h1>Welcome to Principal</h1>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        <!-- Photo Gallery -->
        <section class="photo-gallery">
            <img src="https://placeholder.com" alt="Placeholder 1">
            <img src="https://placeholder.com" alt="Placeholder 2">
            <img src="https://placeholder.com" alt="Placeholder 3">
        </section>

        <!-- CENTERED INPUTS / CONTACT SECTION -->
        <section class="contact-section">
            <div class="contact-container">
                <div class="contact-text">
                    <h1>Get in <span class="highlight">Touch</span></h1>
                </div>
                
                <form class="contact-form">
                    <div class="inputs-container">
                        <div class="input-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="input-group">
                            <input type="email" placeholder="Your Email" required>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Subject" required>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="custom-button">Send Message</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>&copy; 2026 Your Company. All rights reserved.</p>
    </footer>

</body>
</html>
