
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <style>

   .btn {
  /* Layout & Sizing */
  display: inline-block;
  padding: 12px 24px;

  /* Typography */
  font-family: 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  text-align: center;

  /* Colors & Borders */
  color: #1a1100;
  background-color: #ffd480;
  border: none;
  border-radius: 8px;

  /* Interactivity & Performance */
  cursor: pointer;
  user-select: none;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

/* Hover State: When the mouse pointer sits over the button */
.btn {
  background-color: #005ce6;
}

/* Active State: When the button is being clicked */
.custom-button:active {
  transform: scale(0.98);
}

/* Focus State: When navigating via keyboard for web accessibility */
.btn:focus-visible {
  outline: 3px solid #80bfff;
  outline-offset: 2px;
}


        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }



.contact-text .highlight {
    position: relative;
    display: inline-block;
}


/* Reset básico de estilos */


/* Fondo principal oscuro */


/* Contenedor principal de la sección */
.contact-section {
    width: 100%;
    max-width: 1200px;
    padding: 40px 20px;
}

/* Flexbox para alinear las dos columnas */
.contact-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 50px;
    flex-wrap: wrap; /* Permite que sea responsive en móviles */
}

/* Estilos de la columna de texto */
.contact-text {
    flex: 1;
    min-width: 300px;
}

.contact-text h1 {
    font-size: 3.5rem;
    font-weight: 500;
    line-height: 1.2;
}

/* Espacio opcional por si deseas meter el efecto azul sobre la 'o' */
.contact-text .highlight {
    position: relative;
    display: inline-block;
}







 .content-text h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 0.5rem;
          font-family:  Georgia, Serif;
             letter-spacing: 5px;
            font-weight: 180;
        }
        .content-text h3 {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 1rem;
             font-family:  Georgia, Serif;
              font-weight: 160;

        }
       
        .contact-form {
            flex: 0 0 600px; 
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }

        /* 💡 Separates input fields 10px up and down with identical spacing */
        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }



      
      

.input-group input {
    width: 100%;
    padding: 25px 30px;
    font-size: 1.1rem;
    border: 2px solid #ffd700;
    border-radius: 25px;
    background-color: #fcf9f5;
    color: #333333;
    outline: none;
    transition: all 0.3s ease;
}

/* 💻 Desktop */
@media (min-width: 768px) {
    .input-group input {
        width: 600px;
        max-width: 100%;
    }
}

/* Efecto visual al hacer clic en el input */
.input-group input:focus {
    border-color: #ffcc00;
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
    background-color: #ffffff;
}

/* Reset default browser styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;

        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .reg-form { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
   
        .btn { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

        

    <div class="main-container">

        <section class="content-text">


 <div class="form-group">
    <h2>Registro</h2>
    <form id="dataForm" action="https://script.google.com/macros/s/AKfycbyn5rsmSdzGWg6IvoPaEt_Yu6WTBG3gnhZWxbSZvO9BOUzHrtYLPN-1CnVn897rwlTK/exec" method="POST">
        <div class="input-group">
            <label for="cedula"></label>
            <input type="text" id="cedula" name="cedula" placeholder="Cédula" required>
        </div>
        <div class="input-group">
            <label for="username"></label>
            <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
        </div>
        <div class="input-group">
            <label for="cellphone"></label>
            <input type="tel" id="cellphone" name="cellphone" placeholder="Celular" required>
        </div>
        <div class="input-group">
            <label for="address"></label>
            <input type="text" id="address" name="address" placeholder="dirección" required>
        </div>
        <div class="input-group">
            <label for="neighborhood"></label>
            <input type="text" id="neighborhood" name="neighborhood" placeholder="Barrio" required>
        </div>
        
        <button type="submit" id="submitBtn" class="btn">Registrarse</button>
    </form>
</div>

<div id="message"></div>

        <section class="content-text">

</div>
       
<script>
const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    e.preventDefault(); 

    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    // This now works perfectly because the inputs have "name" attributes
    const formData = new FormData(form);
    
    // Convert to URL parameters required by Google Apps Script
    const urlEncodedData = new URLSearchParams();
    for (const pair of formData) {
        urlEncodedData.append(pair[0], pair[1]);
    }

    fetch(form.action, {
        method: 'POST',
        mode: 'no-cors', // Required for Google Apps Script
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncodedData.toString()
    })
    .then(() => {
        messageDiv.textContent = "Data submitted successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        messageDiv.textContent = "Error submitting data. Please check connection.";
        messageDiv.style.color = "red";
        console.error("Submission Error Details:", error); 
    })
    .finally(() => {
        submitBtn.disabled = false;
    });
});
</script>
      






  
</body>
</html>
