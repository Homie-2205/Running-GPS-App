<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <style>
       /* ==========================================================================
   CSS STYLESHEET
   ========================================================================== */

/* Reset default browser styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Make the footer horizontal and full width */
.site-footer {
    width: 100%;
    background-color: #ffd480; 
    color: #fff;            
    text-align: center;     
    padding: 20px 0;        
}

.site-footer p {
    margin: 0;              
}

/* Contenedor principal de la sección */
.contact-section {
    width: 100%;
    max-width: 1200px;
    padding: 40px 20px;
    margin: 0 auto; 
    /* Centers everything dynamically on the page horizontal axis */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Centered form wrapper matching desktop limits */
.contact-form {
    width: 100%;
    max-width: 800px; 
    display: flex;
    flex-direction: column;
    margin: 0 auto;
}

/* 💡 5 Inputs perfectly centered with identical vertical distance */
.inputs-container {
    display: flex;
    flex-direction: column;
    gap: 15px; /* Equal custom padding gap between your 5 inputs */
    width: 100%;
}

/* Estilos de los campos de entrada */
.input-group {
    width: 100%;
}

.input-group input {
    width: 100%;
    padding: 25px 30px;
    font-size: 1.1rem;
    border: 2px solid #ffd700; /* 🟡 Solid gold/yellow border */
    border-radius: 25px; 
    background-color: #fcf9f5; 
    color: #333333;
    outline: none;
    transition: all 0.3s ease;
}

/* Efecto visual al hacer clic en el input */
.input-group input:focus {
    border-color: #ffcc00; /* 🟡 Deeper yellow when active */
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); /* Yellow glow */
    background-color: #ffffff;
}

/* 🔘 Submit button placed with exactly 28px of distance from the inputs */
.submit-wrapper {
    margin-top: 28px;
    display: flex;
    justify-content: center; /* Keeps button centered inside form container */
}

.custom-button {
    /* Layout & Sizing */
    display: inline-block;
    padding: 12px 24px;

    /* Typography */
    font-family: 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;

    /* Colors & Borders */
    color: #1a1100;
    background-color: #ffd480;
    border: none;
    border-radius: 8px;

    /* Interactivity & Performance */
    cursor: pointer;
    user-select: none;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

/* Hover State */
.custom-button:hover {
    background-color: #005ce6;
    color: #fff;
}

/* Active State */
.custom-button:active {
    transform: scale(0.98);
}

/* Focus State */
.custom-button:focus-visible {
    outline: 3px solid #80bfff;
    outline-offset: 2px;
}

/* 💻 Desktop adjustments */
@media (min-width: 1300px) {
    .contact-form {
        width: 800px;
    }
}

/* 📱 Responsive link cleanup hidden elements */
@media (max-width: 450px) {
    .nav-links {
        display: none;
    }
}

.nav-links li {
    margin-right: 1.5rem;
}
.nav-links a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
    margin-right: 1.5rem;
}
.nav-links a:hover {
    color: #00adb5;
}

/* Header image background styling */
.hero-header {
    background-image: url("I.gif");
    text-align: center;
    padding: 4rem 2rem;
    border-bottom: 1px solid #ddd;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    margin: 0;
    height: 60vh;
}
.hero-header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #222;
}

.lang-link {
    color: #334155;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    display: inline-flex; 
    align-items: center; 
    gap: 0.3rem;
    padding: 0.3rem 0.6rem;
    border-radius: 0.375rem;
    transition: all 0.2s ease;
}

/* Main Div Container */
.main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.lang-list {
    display: flex;
    list-style: none;               
    margin: 0 0 0 3rem; 
    padding: 0;
    gap: 1rem;          
}

.content-text h2 {
    font-size: 2rem;
    color: #333;
    margin-bottom: 0.5rem;
    font-family: Georgia, Serif;
    letter-spacing: 5px;
    font-weight: 180;
    text-align: center;
}
.content-text h3 {
    font-size: 1.3rem;
    color: #666;
    margin-bottom: 1rem;
    font-family: Georgia, Serif;
    font-weight: 160;
    text-align: center;
}
.content-text p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #444;
    font-family: Georgia, Serif;
    text-align: center;
}

.container-section {
    padding-top: 40px;
    padding-bottom: 40px;
}

.content-text {
    text-align: center;
}

     
      
     
          
      

    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <div class="logo">
            <!-- Add Logo Here -->
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
        </ul>
    </nav>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <h1>Welcome to Principal</h1>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        <!-- Photo Gallery -->
        <section class="photo-gallery">
            <img src="https://placeholder.com" alt="Placeholder 1">
            <img src="https://placeholder.com" alt="Placeholder 2">
            <img src="https://placeholder.com" alt="Placeholder 3">
        </section>

        <!-- CENTERED INPUTS / CONTACT SECTION -->
        <section class="contact-section">
            <div class="contact-container">
                <div class="contact-text">
                    <h1>Get in <span class="highlight">Touch</span></h1>
                </div>
                
                <form class="contact-form">
                    <div class="inputs-container">
                        <div class="input-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="input-group">
                            <input type="email" placeholder="Your Email" required>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Subject" required>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="custom-button">Send Message</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>&copy; 2026 Your Company. All rights reserved.</p>
    </footer>

</body>
</html>
