<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificación Pushbullet Local</title>
    <style>
        /* Estilos visuales para el botón */
        .btn-notificacion {
            padding: 12px 24px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background-color: #4caf50;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-notificacion:hover {
            background-color: #43a047;
        }

        .btn-notificacion:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- El botón estructurado en HTML -->
    <button id="miBoton" class="btn-notificacion">
        🔔 Enviar Alerta (Sonido + Push)
    </button>

    <!-- El script nativo de JavaScript -->
    <script>
    function enviarNotificacionConSonido() {
        // 1. Reproducir el sonido de notificación en tu PC
        // Asegúrate de tener tu archivo .mp3 en la misma carpeta que este archivo HTML
        const audio = new Audio('bill.mp3');
        audio.play().catch(e => {
            console.log("El navegador bloqueó el audio automático. Haz clic en la página antes de presionar el botón.", e);
        });

        // 2. Parámetros de envío a Pushbullet
        const accessToken = 'o.vbXwA2uFjyMTKFvVTBVMT40YjcUxInxj'; 
        const url = 'https://pushbullet.com';

        const data = {
            type: 'note',
            title: '¡Nueva alerta en tu sistema!',
            body: 'Se ha ejecutado la acción programada en tu computadora.'
        };

        // 3. Petición HTTP nativa a la API
        fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${accessToken}`, 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) throw new Error(`Error en el servidor: ${response.status}`);
            return response.json();
        })
        .then(data => console.log('Notificación Pushbullet enviada con éxito:', data))
        .catch((error) => console.error('Error al conectar con Pushbullet:', error));
    }

    // Escuchar el clic del botón HTML
    document.getElementById('miBoton').addEventListener('click', enviarNotificacionConSonido);
    </script>

</body>
</html>
