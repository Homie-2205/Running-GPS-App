services:
  - type: web
    name: status-toggle-app
    runtime: node
    repo: https://github.com # Update this or leave it out if linking via Render dashboard
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: status-db
          property: connectionString

databases:
  - name: status-db
    plan: free
    postgresVersion: 16
