<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repartidor</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(92vw, 520px);
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #222;
    }

    p {
      color: #555;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    audio {
      width: 100%;
      margin: 12px 0;
    }

    .button {
      background: #ffd480;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      color: #1a1100;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
    }

    .button:hover {
      background: #f7c65a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Repartidor</h1>
    <p>Audio del repartidor. Pulsa el botón para reproducir.</p>

    <audio id="audioPlayer" controls preload="none"></audio>
    <button id="playBtn" class="button" type="button">Play</button>
    <button id="openDriveBtn" class="button" type="button" style="margin-top: 12px; background: #fff1c1;">Abrir archivo en Drive</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const driveId = params.get('driveId') || '1BrQhl2e-mM1DhMUv1hSpTULSD91ffMSz';
    const driveFileUrl = 'https://drive.google.com/file/d/' + driveId + '/view?usp=sharing';
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const openDriveBtn = document.getElementById('openDriveBtn');

    const directAudioUrl = 'https://docs.google.com/uc?export=open&id=' + driveId;
    const downloadAudioUrl = 'https://docs.google.com/uc?export=download&id=' + driveId;

    audio.src = directAudioUrl;

    playBtn.addEventListener('click', function () {
      audio.src = directAudioUrl;
      audio.play().catch(function () {
        audio.src = downloadAudioUrl;
        audio.play().catch(function () {
          alert('No se pudo reproducir el audio. Abre el archivo en Google Drive o revisa los permisos del enlace.');
        });
      });
    });

    openDriveBtn.addEventListener('click', function () {
      window.open(driveFileUrl, '_blank', 'noopener');
    });
  </script>
</body>
</html>
