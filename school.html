<!DOCTYPE html>
<html>
<body>

<h1>The Element Object</h1>
<h2>The addEventListener() Method</h2>

<p>Add two click events to the same button.</p>

<button id="submitBtn">Try it</button>

<p id="demo"></p>

<script>


const element = document.getElementById("submitBtn");
element.addEventListener("click", myFunction1);
element.addEventListener("click", myFunction2);

function myFunction1() {
  const statusText = document.getElementById("status");
  statusText.innerText = "Sending...";

  // 1. Define the API endpoint and your NEW token
  const url = "https://api.pushbullet.com/v2/pushes";
  const accessToken = "o.k1v3f77NaxjtadBUPSJHrRL8iGJd6Y4J"; 

  // 2. Prepare the payload data
  const data = {
    email: "cqacqacqaamerica@gmail.com",
    body: "Space Elevator, Mars Hyperloop, Space Model S (Model Space?)",
    title: "Space Travel Ideas",
    type: "note"
  };

  // 3. Make the browser HTTP request
  fetch(url, {
    method: "POST",
    headers: {
      "Access-Token": accessToken,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
    .then(response => {
      if (response.ok) {
        return response.json();
      }
      throw new Error("Network response was not ok.");
    })
    .then(result => {
      statusText.innerText = "Success! Push sent. First function was executed!";
      console.log(result);
    })
    .catch(error => {
      statusText.innerText = "Error sending push. Check console.";
      console.error("Error:", error);
    });
}

function myFunction2() {
  document.getElementById("submitBtn").innerHTML += "Second function was executed!"
}


  



</script>

</body>
</html>
