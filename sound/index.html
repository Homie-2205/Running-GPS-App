<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Demo</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #1f1f1f;
      color: #fff;
      padding: 14px 18px;
      border-radius: 8px;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 300px;
    }
    button {
      padding: 10px 18px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Website Notifications</h1>
  <button id="enable-notif">Enable browser notifications</button>
  <button id="send-test" style="margin-left:10px;">Send test notification</button>

  <div id="toast"></div>

  <script>
    const socket = io();

    socket.on('notification', (data) => {
      showToast(data.title, data.message);

      if (Notification.permission === 'granted') {
        new Notification(data.title, {
          body: data.message
        });
      }
    });

    document.getElementById('enable-notif').addEventListener('click', async () => {
      const permission = await Notification.requestPermission();
      console.log('Notification permission:', permission);
    });

    document.getElementById('send-test').addEventListener('click', () => {
      fetch('/send-test');
    });

    function showToast(title, message) {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<strong>${title}</strong><br>${message}`;
      toast.style.display = 'block';

      setTimeout(() => {
        toast.style.display = 'none';
      }, 4000);
    }
  </script>
</body>
</html>
