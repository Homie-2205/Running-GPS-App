<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Server Notifications with Sound</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
    #notification-container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .status { font-weight: bold; color: #e67e22; margin-bottom: 15px; }
    .status.connected { color: #2ecc71; }
    .notification-item { background: #eef2f7; padding: 12px; margin-top: 10px; border-left: 5px solid #3498db; border-radius: 4px; }
    .time { font-size: 11px; color: #7f8c8d; display: block; margin-top: 5px; }
    .hint { font-size: 12px; color: #7f8c8d; font-style: italic; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="notification-container">
    <h2>Server Notifications</h2>
    <div id="connection-status" class="status">Connecting to stream...</div>
    <div id="messages-list">
      <p style="color: #95a5a6;">Waiting for live alerts...</p>
    </div>
    <div class="hint">⚠️ Note: Click anywhere on this page first to enable notification sounds.</div>
  </div>

  <!-- High-quality free notification chime -->
  <audio id="notification-sound" src="bill.mp3" preload="auto"></audio>

  <script>
    const statusDiv = document.getElementById('connection-status');
    const listDiv = document.getElementById('messages-list');
    const alertSound = document.getElementById('notification-sound');

    // Dynamically uses the current domain (works both locally and deployed on Render)
    const streamUrl = `${window.location.origin}/events`;
    const eventSource = new EventSource(streamUrl);

    eventSource.onopen = () => {
      statusDiv.innerText = "● Connected to live stream";
      statusDiv.className = "status connected";
    };

    eventSource.onmessage = (event) => {
      if(listDiv.querySelector('p')) listDiv.innerHTML = '';

      const data = JSON.parse(event.data);

      // Play chime sound immediately
      alertSound.currentTime = 0; 
      alertSound.play().catch(error => {
        console.log("Audio playback blocked by browser security. Click on the page first!", error);
      });

      // Build notification component
      const item = document.createElement('div');
      item.className = 'notification-item';
      item.innerHTML = `
        <strong>Notification:</strong> ${data.message}
        <span class="time">${new Date(data.timestamp).toLocaleTimeString()}</span>
      `;

      // Insert new message at the top
      listDiv.insertBefore(item, listDiv.firstChild);
    };

    eventSource.onerror = (error) => {
      console.error("SSE Error:", error);
      statusDiv.innerText = "● Disconnected. Retrying connection...";
      statusDiv.className = "status";
    };
  </script>
</body>
</html>
