<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #0056b3; }
        #logs {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            color: #555;
            font-size: 14px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        p { margin: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Real-Time Notification System</h2>
    <p style="color: #666; font-size: 14px;">Click the button below to allow the browser to play your audio notification.</p>
    
    <!-- Since server.js points to the "sound" folder, notification.mp3 is in the same directory -->
    <audio id="notif-audio" src="bill.mp3" preload="auto"></audio>
    
    <button id="trigger-btn">Test Notification Sound</button>
    <div id="logs"></div>
</div>

<script>
    const audio = document.getElementById('notif-audio');
    const triggerBtn = document.getElementById('trigger-btn');
    const logs = document.getElementById('logs');

    function logMessage(text) {
        const item = document.createElement('p');
        item.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        logs.prepend(item);
    }

    // Connects relatively to your Render root domain /events path [3]
    const eventSource = new EventSource('/events');

    eventSource.onmessage = function(event) {
        // Render sends an initial pulse comment ': ok', ignore JSON parsing on empty/malformed data [3]
        if (!event.data || event.data.trim() === 'ok') return;
        
        try {
            const data = JSON.parse(event.data);
            logMessage(`Notification received: ${data.message}`);
            
            // Play your mp3 audio track [3]
            audio.play().catch(err => {
                logMessage("Audio blocked. Click the button to grant playback permissions.");
            });
        } catch(e) {
            // Quietly catch heartbeat pulses
        }
    };

    // Client button click sets up audio context permissions and triggers a test notification [3]
    triggerBtn.addEventListener('click', () => {
        // Essential: Unlock the audio element for browsers so it can autoplay down the road [3]
        audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            logMessage("Audio channel unlocked successfully!");
        }).catch(() => {});

        // Send a request to trigger the notification across all connected user tabs [3]
        fetch('/trigger-notification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Hello from Render live app!" })
        })
        .then(res => res.json())
        .then(data => logMessage("Sent trigger request to server..."))
        .catch(err => logMessage("Error sending request: " + err));
    });
</script>

</body>
</html>
