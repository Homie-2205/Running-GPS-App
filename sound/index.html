<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
</head>
<body>

    <h2>My Audio Player Cristian</h2>
    
  

    <script>
async function sendNotification() {
  const response = await fetch("/send-push", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      title: "Running App",
      body: "Your website has sent a notification!"
    })
  });

  const result = await response.json();

  alert(result.success
    ? "Notification sent!"
    : "Error sending notification");
}

        
    </script>

    <button onclick="sendNotification()"  id="submitBtn" >
  Send Notification
</button>



    

</body>
</html>
