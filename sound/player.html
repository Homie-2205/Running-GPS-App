<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        /* Overlay to capture user interaction for autoplay */
        #autoplay-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #play-now-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            background-color: #1DB954; /* Spotify Green */
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
        }
        .player-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Autoplay Overlay Screen -->
    <div id="autoplay-overlay">
        <h2>Your music is ready!</h2>
        <button id="play-now-btn">Click to Listen</button>
    </div>

    <div class="player-container">
        <h1>Music Player Page</h1>
        
        <audio id="myAudio" controls>
            <!-- NOTE: Ensure bill.mp3 is in the same folder as this file on Render -->
            <source src="bill.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <p><br>
            <a href="index2.html">Go Back Home</a>
        </p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shouldPlay = urlParams.get('play');
            const audio = document.getElementById('myAudio');
            const overlay = document.getElementById('autoplay-overlay');
            const playBtn = document.getElementById('play-now-btn');

            if (shouldPlay === 'true') {
                audio.play().catch(() => {
                    // If browser blocks autoplay, show the interactive overlay
                    overlay.style.display = 'flex';
                });
            }

            playBtn.addEventListener('click', () => {
                audio.play();
                overlay.style.display = 'none';
            });
        });
    </script>
</body>
</html>
