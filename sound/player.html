<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        /* Overlay to capture user interaction for autoplay */
        #autoplay-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: sans-serif;
        }
        #play-now-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            background-color: #1DB954; /* Spotify Green */
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Autoplay Overlay Screen -->
    <div id="autoplay-overlay">
        <h2>Your music is ready!</h2>
        <button id="play-now-btn">Click to Listen</button>
    </div>

    <h1>Music Player Page</h1>
    
    <audio id="myAudio" controls>
        <!-- NOTE: Ensure bill.mp3 is in the same folder as this file on Render -->
        <source src="bill.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <br><br>
    <a href="index2.html">Go Back Home</a>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shouldPlay = urlParams.get('play');
            const audio = document.getElementById('myAudio');
            const overlay = document.getElementById('autoplay-overlay');
            const playBtn = document.getElementById('play-now-btn');

            if (shouldPlay === 'true') {
                // Show the overlay asking the user to click
                overlay.style.display = 'flex';

                playBtn.addEventListener('click', () => {
                    // Hide overlay and play audio upon explicit user interaction
                    overlay.style.display = 'none';
                    audio.play().catch(error => {
                        console.error("Playback failed. Please ensure bill.mp3 exists:", error);
                    });
                });
            }
        });
    </script>

</body>
</html>
