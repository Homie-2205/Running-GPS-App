<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
</head>
<body>

    <h1>Music Player Page</h1>
    
    <audio id="myAudio" controls>
        <source src="bill.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <br><br>
    <!-- Optional: Link to go back to your renamed main page -->
    <a href="index2.html">Go Back Home</a>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shouldPlay = urlParams.get('play');
            const audio = document.getElementById('myAudio');

            if (shouldPlay === 'true') {
                audio.play().catch(error => {
                    console.log("Autoplay blocked. Click play manually:", error);
                });
            }
        });
    </script>

</body>
</html>
