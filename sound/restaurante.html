<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node.js Click Example</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    h1 { color: #333; margin-top: 20px; }
  </style>
</head>
<body>

  <button id="myButton">Click Me to Ask Node.js</button>
  <h1 id="output"></h1>

 

<script src="/sound/restaurante.js"></script>
<script>

// 1. DOM Element Selectors
const button = document.getElementById('myButton');
const output = document.getElementById('output');
const messageContainer = document.getElementById('message-container');

// 2. Event Listeners
button.addEventListener('click', handleFetchSequence);

// 3. Event Handlers & Logic
async function handleFetchSequence() {
    try {
        // Fetch and display data from your local Node.js API endpoint
        const apiResponse = await fetch('/api/message');
        if (!apiResponse.ok) throw new Error(`API fetch failed: ${apiResponse.status}`);
        
        const apiData = await apiResponse.json();

        // Update the output containers with the API data
        if (output) {
            output.textContent = apiData.message;
        }
        
        if (messageContainer) {
            messageContainer.innerText = apiData.message;
        }

    } catch (error) {
        handleFetchError(error);
    }
}

// 4. Error Handling
function handleFetchError(error) {
    console.error('Error fetching data:', error);
    if (output) {
        output.textContent = 'Failed to load message. Please try again.';
    }
}


</script>







</body>
</html>
