<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Command to Server</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #eef2f3;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Interact with the Backend</h1>
    <!-- Clicking this button sends a command to the server -->
    <button onclick="sendCommandToServer()">Ping the Server</button>

    <script>
        // This script automatically sets your text from earlier
        console.log("HTML loaded in the browser.");

        // This function runs when the button is clicked
        function sendCommandToServer() {
            // Fetch sends a background request to the server at the /command path
            fetch('/command')
                .then(response => response.text())
                .then(data => {
                    alert("Server replied: " + data);
                })
                .catch(err => console.error("Error:", err));
        }
    </script>

</body>
</html>
