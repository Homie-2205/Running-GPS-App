<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node.js Click Example</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    h1 { color: #333; margin-top: 20px; }
  </style>
</head>
<body>

  <button id="myButton">Click Me to Ask Node.js</button>
  <h1 id="output"></h1>

 

<script src="/sound/restaurante.js"></script>
<script>
  
const button = document.getElementById('myButton');
const output = document.getElementById('output');
const messageContainer = document.getElementById('message-container');

button.addEventListener('click', async () => {
    try {
        // 1. Fetch from your live Render URL
        const response = await fetch('https://running-gps-app.onrender.com/sound/restaurante.js');
        const data = await response.json();
        
        // Update the main output element
        output.textContent = data.message;

        // 2. Fetch from your relative local/Render API path
        const apiResponse = await fetch('/api/message');
        const apiData = await apiResponse.json();

        // Update the secondary message container
        if (messageContainer) {
            messageContainer.innerText = apiData.message;
        }

    } catch (error) {
        // Properly handle any network or parsing errors
        console.error('Error fetching data:', error);
        output.textContent = 'Failed to load message. Please try again.';
    }
});

</script>







</body>
</html>
