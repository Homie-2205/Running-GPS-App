<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node.js Click Example</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    h1 { color: #333; margin-top: 20px; }
  </style>
</head>
<body>

  <button id="myButton">Click Me to Ask Node.js</button>
  <h1 id="output"></h1>

 


<script>
    const button = document.getElementById('myButton');
    const output = document.getElementById('output');

    button.addEventListener('click', async () => {
      try {
        // REPLACE THIS URL with your actual live Render URL + /restaurante
        const response = await fetch('https://running-gps-app.onrender.com/sound/restaurante.html'); 
        
        const data = await response.json();
        
        // This puts the response message into your HTML element
        output.textContent = data.message;
      } catch (error) {
        output.textContent = "Couldn't connect to server.";
        console.error(error);
      }
    });
</script>







</body>
</html>
