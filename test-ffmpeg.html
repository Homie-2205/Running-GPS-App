<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Status Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .test-btn {
            background-color: #667eea;
            color: white;
        }

        .test-btn:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .test-btn:active {
            transform: translateY(0);
        }

        .clear-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .clear-btn:hover {
            background-color: #d0d0d0;
        }

        .status-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            min-height: 60px;
        }

        .status-box.loading {
            border-left-color: #ffc107;
            background: #fffbf0;
        }

        .status-box.success {
            border-left-color: #28a745;
            background: #f0f8f4;
        }

        .status-box.error {
            border-left-color: #dc3545;
            background: #fdf0f0;
        }

        .status-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 5px;
        }

        .status-box.success .status-label {
            color: #28a745;
        }

        .status-box.error .status-label {
            color: #dc3545;
        }

        .status-box.loading .status-label {
            color: #ffc107;
        }

        .status-text {
            color: #333;
            font-size: 16px;
            word-break: break-all;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ffc107;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .response-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .response-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .response-text {
            color: #666;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1565c0;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 FFmpeg Status Tester</h1>

        <div class="info-box">
            <strong>ℹ️ How to use:</strong>
            Click the "Test FFmpeg Status" button to check if FFmpeg is running on your Render server.
        </div>

        <div class="button-group">
            <button class="test-btn" onclick="testFFmpeg()">Test FFmpeg Status</button>
            <button class="clear-btn" onclick="clearResults()">Clear</button>
        </div>

        <div id="statusBox" class="status-box" style="display: none;">
            <div class="status-label">Status</div>
            <div class="status-text">
                <span id="statusText"></span>
            </div>
        </div>

        <div id="responseBox" class="response-box" style="display: none;">
            <h3>Full Response:</h3>
            <div class="response-text" id="responseText"></div>
        </div>
    </div>

    <script>
        async function testFFmpeg() {
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const responseBox = document.getElementById('responseBox');
            const responseText = document.getElementById('responseText');

            // Show loading state
            statusBox.style.display = 'block';
            statusBox.className = 'status-box loading';
            statusText.innerHTML = '<span class="spinner"></span>Testing FFmpeg...';
            responseBox.style.display = 'none';

            try {
                // Try to call the FFmpeg test endpoint
                const response = await fetch('/api/ffmpeg-status');
                const data = await response.json();

                // Update status box
                if (response.ok && data.ffmpegInstalled) {
                    statusBox.className = 'status-box success';
                    statusText.innerHTML = '✅ FFmpeg is running and available!';
                } else {
                    statusBox.className = 'status-box error';
                    statusText.innerHTML = '❌ FFmpeg is not available';
                }

                // Show full response
                responseBox.style.display = 'block';
                responseText.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                statusBox.className = 'status-box error';
                statusText.innerHTML = '❌ Error: Could not reach server';
                responseBox.style.display = 'block';
                responseText.textContent = 'Error: ' + error.message + '\n\nMake sure your server is running and the /api/ffmpeg-status endpoint exists.';
            }
        }

        function clearResults() {
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('responseBox').style.display = 'none';
            document.getElementById('statusText').innerHTML = '';
            document.getElementById('responseText').innerHTML = '';
        }

        // Optional: Auto-test on page load
        window.addEventListener('load', () => {
            console.log('Page loaded. You can click "Test FFmpeg Status" to check if FFmpeg is running.');
        });
    </script>
</body>
</html>
